name: SRF-News für Alarmdisplay

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Feed holen
        run: mkdir out && python3 tools/srf_news.py out/news.json
      - name: In Branch «news» ablegen (ohne Verlauf)
        run: |
          cd out
          git init -q -b news
          git config user.name "news-bot"; git config user.email "news-bot@users.noreply.github.com"
          git add news.json && git commit -qm "SRF-News $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" news
