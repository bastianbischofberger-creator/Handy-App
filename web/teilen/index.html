<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Einsatzdaten teilen</title>
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Teilen">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#efedea,#111315);--card:light-dark(#fff,#1b1e21);--ink:light-dark(#16181a,#eef0f2);--mute:light-dark(#5b6166,#9aa1a7);--line:light-dark(#d8d4ce,#30353a);--field:light-dark(#f7f6f4,#24282c);--red:#c8102e;--warn:#f2b705;--ok:light-dark(#1d7a46,#45c47a);--c:#6a3fb5}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;overflow-x:clip}
.top{position:sticky;top:0;z-index:1000;background:var(--red);color:#fff;display:flex;align-items:center;gap:10px 16px;padding:calc(10px + env(safe-area-inset-top)) max(3vw,14px) 10px}
.top a.logo{flex:none;width:52px;height:54px;display:grid;place-items:center}
.top a.logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.top h1{font:600 22px/1.1 "Barlow Condensed",sans-serif;margin:0;flex:1}
.top h1 small{display:block;font:500 14px Barlow,sans-serif;opacity:.9;margin-top:2px}
#clock{font:700 clamp(28px,5vw,42px)/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.sync{font-size:13.5px;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.18);white-space:nowrap}
.sync::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#bbb;vertical-align:1px}
.sync.ok::before{background:#5ee08f}.sync.warn::before{background:var(--warn)}.sync.err::before{background:#fff;outline:2px solid #000}
button,.btn{font:600 16px Barlow,sans-serif;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
button.pri{background:var(--c);border-color:var(--c);color:#fff}
button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
button.danger{color:var(--red)}
main{max-width:1100px;margin:0 auto;padding:14px max(3vw,12px) calc(30px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.ein{border-top:6px solid var(--c);grid-column:1/-1}
.ein b{font:700 26px/1.1 "Barlow Condensed",sans-serif;display:block}
h2{font:700 24px/1.1 "Barlow Condensed",sans-serif;margin:0 0 10px}
.sec{font:700 13px Barlow,sans-serif;letter-spacing:.06em;color:var(--mute);margin:14px 0 8px}
.mute{color:var(--mute)}.small{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:42px;padding:4px 12px;border-radius:999px}
.chips button.on{background:var(--c);border-color:var(--c);color:#fff}
.mode{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mode button{flex-direction:column;align-items:flex-start;text-align:left;min-height:70px;gap:2px}
.mode button small{font-weight:500;font-size:13px;opacity:.85}
.mode button.on{border:3px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card));color:var(--ink)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media(max-width:480px){.fields{grid-template-columns:1fr}}
.fields label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:48px;font-weight:600;cursor:pointer;margin:0;color:var(--ink);font-size:15px}
.fields input{width:24px;height:24px;min-height:0;margin:0;accent-color:var(--c);flex:none}
label.f{display:block;font-size:14px;font-weight:600;color:var(--mute);margin:10px 0 0}
input,textarea{display:block;width:100%;margin-top:4px;font:16px Barlow,sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px}
textarea{min-height:70px;resize:vertical}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.items li{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.items li b{font-size:18px}
.st{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:6px;background:var(--c);color:#fff}
.st.off{background:var(--line);color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.live{background:color-mix(in srgb,var(--ok) 14%,var(--card));border:1px solid var(--ok);border-radius:10px;padding:10px 12px;font-weight:600;font-size:15px;grid-column:1/-1}
.live::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:8px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
dialog{border:0;border-radius:14px;padding:18px;width:min(420px,94vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
dialog::backdrop{background:rgba(0,0,0,.55)}
#qr{background:#fff;padding:12px;border-radius:10px;display:inline-block}
#qr svg,#qr img{display:block;width:min(280px,70vw);height:auto}
.link{word-break:break-all;font-size:13px;color:var(--mute);margin:10px 0}
#login{position:fixed;inset:0;z-index:3000;background:var(--bg);display:grid;place-items:center;padding:16px}
.err{color:var(--red);font-weight:600;margin:0}.err:empty{display:none}
#msg{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16181a;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:4000;max-width:90vw}
#msg:empty{display:none}
@media(max-width:520px){.top h1 small{display:none}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="../start/" title="Zur Startseite"><img src="logo.png" alt="FW RTL"></a>
  <h1>Einsatzdaten teilen<small>Für Polizei, Rettungsdienst, Partner – live oder als Momentaufnahme</small></h1>
  <span class="sync" id="sync">Startet …</span>
  <div id="clock">--:--</div>
</header>
<main>
  <div class="card ein" id="ein"></div>
  <div class="live" id="live" hidden></div>

  <section class="card">
    <h2>Neue Freigabe</h2>
    <div class="sec">EMPFÄNGER</div>
    <div class="chips" id="cEmp"></div>
    <input id="emp" placeholder="Empfänger (z. B. Kantonspolizei, Rettungsdienst)" autocomplete="off" style="margin-top:8px">

    <div class="sec">ART</div>
    <div class="mode" id="cMode">
      <button type="button" data-m="live" class="on"><b>Live</b><small>Wird laufend aktualisiert</small></button>
      <button type="button" data-m="snap"><b>Momentaufnahme</b><small>Stand jetzt, bleibt unverändert</small></button>
    </div>

    <div class="sec">WAS WIRD GETEILT?</div>
    <div class="fields" id="cF"></div>
    <label class="f" id="lLage">Lagemeldung<textarea id="lage" placeholder="z. B. Brand im 1. OG, 2 Personen gerettet, Strasse gesperrt"></textarea></label>
    <label class="f" id="lTreff">Treffpunkt / Zufahrt<input id="treff" placeholder="z. B. Zufahrt über …, Treffpunkt beim KP" autocomplete="off"></label>
    <label class="f" id="lTel">Telefon Einsatzleiter / KP<input id="tel" type="tel" placeholder="+41 …" autocomplete="off"></label>

    <div class="sec">GÜLTIG BIS</div>
    <div class="chips" id="cBis"></div>
    <input id="bisZeit" type="time" style="margin-top:8px" hidden>

    <p class="err" id="fErr" style="margin-top:10px"></p>
    <div class="btns"><button type="button" class="pri" id="bNew" style="flex:1">Freigabe erstellen</button></div>
  </section>

  <section class="card">
    <h2>Aktive Freigaben</h2>
    <ul class="items" id="list"></ul>
  </section>
</main>

<dialog id="dQr">
  <h2 id="qT">Freigabe</h2>
  <div id="qr"></div>
  <p class="link" id="qL"></p>
  <div class="btns" style="justify-content:center"><button type="button" id="qCopy">Link kopieren</button><button type="button" id="qShare">Teilen …</button><button type="button" class="pri" id="qClose">Schliessen</button></div>
</dialog>

<div id="login" hidden><form id="fLogin" class="card" style="width:min(380px,100%)">
  <img src="logo.png" alt="" style="width:70px;display:block;margin:0 auto 6px"><h2 style="text-align:center">Anmelden</h2>
  <p class="mute" style="margin:0 0 12px;font-size:14px">Gleiches Konto wie ASÜ und Journal.</p>
  <label class="f">E-Mail<input name="email" type="email" autocomplete="username" required></label>
  <label class="f">Passwort<input name="pw" type="password" autocomplete="current-password" required></label>
  <p class="err" id="lErr"></p>
  <button class="pri" style="width:100%;margin-top:12px">Anmelden</button>
</form></div>
<div id="msg"></div>
<script src="config.js?v=1.0.0"></script>
<script src="../vendor/qrcode-generator/qrcode.js"></script>
<script src="../shared/fwui.js?v=1"></script>
<script src="../shared/fwsync.js?v=2"></script>
<script type="module" src="app.js?v=1.0.0"></script>
</body>
</html>
