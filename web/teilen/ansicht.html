<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Einsatzdaten – Feuerwehr RTL</title>
<meta name="theme-color" content="#c8102e">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#efedea,#111315);--card:light-dark(#fff,#1b1e21);--ink:light-dark(#16181a,#eef0f2);--mute:light-dark(#5b6166,#9aa1a7);--line:light-dark(#d8d4ce,#30353a);--red:#c8102e;--warn:#f2b705;--ok:light-dark(#1d7a46,#45c47a)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Barlow,system-ui,sans-serif}
.top{position:sticky;top:0;z-index:1000;background:var(--red);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.top img{width:46px;height:48px;object-fit:contain}
.top h1{font:600 21px/1.1 "Barlow Condensed",sans-serif;margin:0;flex:1}
.top h1 small{display:block;font:500 14px Barlow,sans-serif;opacity:.9}
.badge{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.2);white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:14px 12px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.head b{font:700 30px/1.1 "Barlow Condensed",sans-serif;display:block}
h2{font:700 20px/1.1 "Barlow Condensed",sans-serif;margin:0 0 8px;color:var(--mute);letter-spacing:.03em}
.mute{color:var(--mute)}.small{font-size:15px}
#map{height:300px;border-radius:10px;border:1px solid var(--line)}
.lage{font-size:20px;font-weight:600;white-space:pre-wrap}
.j{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.j li{display:flex;gap:10px}.j time{font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums;flex:none}
.j li.p span{background:color-mix(in srgb,var(--warn) 35%,transparent);font-weight:700;padding:0 4px;border-radius:4px}
.tr{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:6px 0}
.not{background:var(--red);color:#fff;border-radius:10px;padding:10px 14px;font-weight:800;font-size:20px}
.big{font:700 34px/1 "Barlow Condensed",sans-serif}
a.tel{display:inline-flex;min-height:48px;align-items:center;padding:8px 16px;border-radius:10px;background:var(--ok);color:#fff;font-weight:700;text-decoration:none;font-size:19px}
.end{text-align:center;padding:40px 16px}
.end b{font:700 28px "Barlow Condensed",sans-serif;display:block;margin-bottom:6px}
footer{text-align:center;font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<header class="top">
  <img src="logo.png" alt="FW RTL">
  <h1>Feuerwehr Rheineck-Thal-Lutzenberg<small id="sub">Einsatzdaten</small></h1>
  <span class="badge" id="badge">Lädt …</span>
</header>
<main id="main">
  <div class="card end" id="state"><b>Einsatzdaten werden geladen …</b><span class="mute">Einen Moment bitte.</span></div>
</main>
<script src="config.js?v=1.0.0"></script>
<script src="../vendor/leaflet/leaflet.js"></script>
<script type="module" src="ansicht.js?v=1.0.0"></script>
</body>
</html>
