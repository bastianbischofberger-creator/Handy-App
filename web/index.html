<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Einsatzkarte</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Einsatzkarte" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { position: absolute; inset: 0; }
    #glmap { position: absolute; inset: 0; z-index: 100; pointer-events: none; }
    .leaflet-container { background: #e8e8e8; }

    #top { position: absolute; z-index: 1000; left: 12px; right: 12px;
      top: calc(env(safe-area-inset-top) + 8px); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    #topRow { display: flex; justify-content: flex-end; align-items: flex-start; }
    #logo { width: 46px; height: 48px; object-fit: contain; }
    /* Hinweis erscheint nur beim Einfügen */
    #hint { background: rgba(0,0,0,.7); color: #fff; border-radius: 10px; padding: 8px 12px; font-size: 14px; }
    #hint:empty { display: none; }

    #locate { position: absolute; z-index: 1000; right: 14px; width: 50px; height: 50px; border-radius: 25px;
      border: 0; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.3); font-size: 28px; color: #1565C0; line-height: 50px; padding: 0; }
    #compass { position: absolute; z-index: 1000; right: 14px; width: 50px; height: 50px; border-radius: 25px; border: 0; padding: 0;
      background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.3); }
    #compass.on { box-shadow: 0 0 0 4px #1565C0, 0 1px 6px rgba(0,0,0,.3); }
    #map.penMode, #map.penMode * { touch-action: none !important; }
    /* Seite selbst nie zoomen (nur die Karte): sonst vergrössert ein Zwei-Finger-Griff unten die ganze Ansicht */
    body { touch-action: pan-x pan-y; }
    .colors { display: flex; gap: 8px; justify-content: space-between; }
    .colors button { flex: 1; height: 40px; border-radius: 20px; border: 2px solid #999; padding: 0; }
    .colors button.active { border: 4px solid #1565C0; box-shadow: 0 0 0 2px #fff inset; }
    #northBtn { position: absolute; z-index: 1000; right: 74px; height: 40px; border: 0; border-radius: 20px; padding: 0 14px;
      background: #1565C0; color: #fff; font-size: 15px; font-weight: 700; box-shadow: 0 1px 6px rgba(0,0,0,.3); display: none; }
    #northBtn.show { display: block; }
    #needle { width: 50px; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #needle b { color: #D32F2F; font-size: 14px; line-height: 14px; }
    #needle i { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent;
      border-bottom: 18px solid #D32F2F; margin-top: 1px; }
    #attribution { position: absolute; z-index: 1000; left: 8px; font-size: 11px; color: #333;
      background: rgba(255,255,255,.7); padding: 0 4px; border-radius: 3px; }

    #panel { position: absolute; z-index: 1000; left: 0; right: 0; bottom: 0; background: #fff;
      border-radius: 18px 18px 0 0; padding: 12px 12px calc(env(safe-area-inset-bottom) + 10px);
      box-shadow: 0 -2px 10px rgba(0,0,0,.2); display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 8px; }
    .btn { flex: 1; border: 0; padding: 14px 6px; border-radius: 12px; background: #eee;
      font-size: 15px; font-weight: 600; color: #222; line-height: 1.2; }
    .btn:active { opacity: .7; }
    .btn.add { background: #1565C0; color: #fff; font-size: 17px; }
    /* Hauptleiste: Optionen · Plus · Löschen; am PC kompakt in der Mitte */
    .row.mainBar { width: 100%; max-width: 520px; margin: 0 auto; align-items: stretch; }
    .btn.icon { flex: 0 0 64px; display: flex; align-items: center; justify-content: center; padding: 12px 0; }
    .btn.plus { font-size: 34px; font-weight: 400; padding: 6px; }
    .menu { display: flex; flex-direction: column; gap: 8px; }
    .btn.menuItem { text-align: left; padding: 15px 16px; font-size: 16px; background: #f1f4f8; }
    .rubric { width: 100%; font-size: 16px; font-weight: 700; padding: 10px 12px; border-radius: 10px; border: 2px solid #1565C0;
      background: #E3F2FD; color: #0D47A1; -webkit-appearance: none; appearance: none; }
    .legend { display: flex; gap: 6px; justify-content: space-between; font-size: 13px; font-weight: 600; color: #222; }
    .legend div { display: flex; align-items: center; gap: 4px; }
    .legend i { display: inline-block; width: 22px; height: 8px; border-radius: 4px; border: 1.5px solid #333; }
    .btn.small { font-size: 14px; padding: 14px 2px; }
    .btn.primary { background: #1565C0; color: #fff; }
    .btn.danger { background: #C62828; color: #fff; }

    .palette { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
    .palItem { flex: 0 0 84px; display: flex; flex-direction: column; align-items: center; padding: 8px 2px;
      border-radius: 12px; border: 2px solid transparent; background: #f4f4f4; }
    .palItem.active { border-color: #1565C0; background: #E3F2FD; }
    .palItem span { font-size: 11px; text-align: center; margin-top: 4px; color: #222; line-height: 1.2; }

    .lineChoice { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 4px;
      border-radius: 12px; border: 2px solid #ddd; background: #fafafa; min-width: 0; }
    .lineChoice span { font-size: 13px; font-weight: 600; color: #222; margin-top: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .lineChoice.disabled { opacity: .35; }
    .sample { display: flex; align-items: center; min-height: 14px; gap: 4px; }

    .fksIcon { display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 6px;
      box-shadow: 0 1px 3px rgba(0,0,0,.45); }
    .rLabel { width: 18px; height: 20px; display: flex; align-items: center; justify-content: center; background: #fff;
      color: #00A651; font-weight: 800; font-size: 15px; border-radius: 3px; border: 2px solid #00A651; box-sizing: border-box; }
    .palItem { position: relative; }
    .palItem .nr { position: absolute; top: 4px; left: 6px; width: 18px; height: 18px; border-radius: 9px; background: #D32F2F;
      color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
    .item { display: flex; align-items: center; justify-content: center; }
    /* ausgewähltes Symbol leuchtet gelb */
    .item.sel { filter: drop-shadow(0 0 3px #FFD600) drop-shadow(0 0 6px #FFD600) drop-shadow(0 0 10px #FFC400); }
    .signRot { display: flex; line-height: 0; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
    .palPic { height: 42px; display: flex; align-items: center; justify-content: center; }
    .adjRow { display: flex; align-items: center; gap: 8px; }
    .adjLabel { width: 54px; font-size: 14px; font-weight: 700; color: #222; flex: 0 0 auto; }
    .adjVal { min-width: 50px; text-align: center; font-size: 14px; font-weight: 600; color: #222; flex: 0 0 auto; }
    .adjRow input[type=range] { flex: 1; min-width: 0; height: 32px; }
    .adjRow input.center { background: linear-gradient(90deg, transparent calc(50% - 1px), #1565C0 calc(50% - 1px), #1565C0 calc(50% + 1px), transparent calc(50% + 1px)) no-repeat center / 100% 22px; }
    .mini { flex: 0 0 44px; height: 40px; border: 0; border-radius: 10px; background: #eee; font-size: 20px; font-weight: 700; color: #222; padding: 0; }
    .mini.wide { flex: 1; font-size: 15px; }
    .mini:disabled { opacity: .35; }
    .editTitle { font-size: 16px; font-weight: 700; color: #222; }
    .badge { display: flex; align-items: center; justify-content: center; border-radius: 50%;
      border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); color: #fff; font-weight: 800; }
    .symbolIcon { background: none; border: 0; }
    .draftDot { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid; }

    #shareView { position: fixed; inset: 0; z-index: 1900; background: rgba(0,0,0,.85); display: none;
      flex-direction: column; padding: calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px); gap: 12px; }
    #shareView.open { display: flex; }
    #shareImg { flex: 1; min-height: 0; width: 100%; object-fit: contain; -webkit-touch-callout: default; }
    #shareNote { color: #fff; font-size: 14px; text-align: center; }
    #shareImg.qr { image-rendering: pixelated; }
    #dialog { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.35); display: none;
      align-items: center; justify-content: center; padding: 24px; }
    #dialog.open { display: flex; }
    #dialogButtons { flex-wrap: wrap; }
    .btn.cancel { flex-basis: 100%; background: transparent; color: #555; padding: 10px 6px; }
    #dialogBox { background: #fff; border-radius: 14px; padding: 18px; width: 100%; max-width: 340px; }
    #dialogTitle { font-weight: 700; font-size: 17px; margin-bottom: 6px; }
    #dialogText { font-size: 15px; color: #333; margin-bottom: 14px; white-space: pre-line; }
    #dialogText:empty { display: none; }
    #dialogButtons.stack { flex-direction: column; margin-bottom: 14px; }
    #dialogButtons.stack .btn { flex: 0 0 auto; }
    #dialogBox > .btn.cancel { width: 100%; margin-top: 4px; }
    #dialogExtra:not(:empty) { margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }
    /* Optionen: Kartenart */
    .optLabel { font-size: 13px; font-weight: 700; color: #666; margin-top: 4px; }
    .segment { display: flex; background: #eee; border-radius: 12px; padding: 3px; }
    .segment button { flex: 1; border: 0; background: none; padding: 11px 4px; border-radius: 10px;
      font-weight: 600; font-size: 15px; color: #333; }
    .segment button.active { background: #D32F2F; color: #fff; }
    /* Adresssuche */
    .searchInput { width: 100%; font-size: 17px; padding: 11px 12px; border: 2px solid #1565C0; border-radius: 10px; -webkit-appearance: none; }
    .results { border: 1px solid #ddd; border-radius: 10px; overflow: hidden; max-height: 46vh; overflow-y: auto; }
    .results:empty { display: none; }
    .results button { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid #eee; background: #fff;
      padding: 12px 10px; font-size: 15px; color: #222; }
    .results button:first-child { border-top: 0; }
    .results button:active { background: #E3F2FD; }
    .results .msg { padding: 12px 10px; font-size: 14px; color: #666; }
    /* rote Nadel der gesuchten Adresse, Spitze genau auf dem Ort */
    .pin { position: relative; width: 0; height: 0; }
    .pin svg { position: absolute; left: -17px; top: -44px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
    .pin span { position: absolute; left: 0; bottom: 48px; transform: translateX(-50%); background: #fff; border: 2px solid #D32F2F;
      border-radius: 8px; padding: 3px 8px; font-size: 14px; font-weight: 700; color: #222; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="top">
    <div id="topRow">
      <img id="logo" src="logo.png" alt="Logo" />
    </div>
    <div id="hint"></div>
  </div>

  <button id="northBtn">↑ Nach Norden</button>
  <button id="compass" aria-label="Karte drehen ein/aus"><div id="needle"><b>N</b><i></i></div></button>
  <button id="locate" aria-label="Zu meinem Standort">◎</button>
  <div id="attribution">© swisstopo</div>
  <div id="panel"></div>

  <div id="shareView">
    <img id="shareImg" alt="Kartenausschnitt" />
    <div id="shareNote"></div>
    <div class="row" id="shareButtons"></div>
  </div>

  <div id="dialog">
    <div id="dialogBox">
      <div id="dialogTitle"></div>
      <div id="dialogText"></div>
      <div id="dialogExtra"></div>
      <div class="row" id="dialogButtons"></div>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/leaflet-rotate/leaflet-rotate.js"></script>
  <script src="vendor/qrcode-generator/qrcode.js"></script>
  <script>
  (function () {
    // ---------- Einstellungen ----------
    const BASE_MAPS = {
      // SWISSIMAGE gibt es bis Zoomstufe 20 (ca. 15 cm pro Bildpunkt); bisher wurde ab 18 nur vergrössert
      luftbild: { label: 'Luftbild', url: 'https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg', nativeMax: 20 },
      // Vektorkarte: aus Linien statt Bildern, darum bei jeder Zoomstufe scharf (auch im geteilten Bild)
      vektor: { label: 'Vektor', style: 'https://vectortiles.geo.admin.ch/styles/ch.swisstopo.basemap.vt/style.json' },
    };
    // Die 6 Absprachepunkte nach FKS (Feuerwehr Koordination Schweiz)
    const FKS_BLUE = '#2F6DB5';
    const RA_GREEN = '#00A651'; // Rettungsachse: grün, damit sie sich von Wasser und blauen Symbolen abhebt
    const FKS_RECT = '<rect x="6" y="6" width="28" height="28"/>';
    const SYMBOL_TYPES = [
      { id: 'patientensammelstelle', nr: 1, name: 'Patientensammelstelle', svg: FKS_RECT + '<path d="M20 6V34M6 20H34"/>' },
      { id: 'sanhist', nr: 2, name: 'San Hist', svg: FKS_RECT + '<path d="M20 6V34M6 18H34M6 22.5H34"/>' },
      { id: 'rettungsachse', nr: 3, name: 'Rettungsachse', zone: 'rettungsachse', stroke: RA_GREEN,
        svg: '<path d="M20 2V9M20 24V29"/><text x="20" y="21" text-anchor="middle" font-size="13" font-weight="800" font-family="Arial, Helvetica, sans-serif" fill="' + RA_GREEN + '" stroke="none">R</text><path d="M14 29H26L20 38Z" fill="' + RA_GREEN + '" stroke="none"/>' },
      { id: 'einsatzleitung', nr: 4, name: 'Einsatzleitung', svg: '<path d="M15 3V25M13.3 4.7H31M15 13H29"/><circle cx="15" cy="31" r="6"/>' },
      { id: 'sammelstelle', nr: 5, name: 'Sammelstelle Unverletzte', svg: FKS_RECT + '<path d="M6 18H34M6 22.5H34"/>' },
      { id: 'warteraum', nr: 6, name: 'Warteraum', svg: FKS_RECT + '<text x="20" y="28" text-anchor="middle" font-size="21" font-weight="800" font-family="Arial, Helvetica, sans-serif" fill="' + FKS_BLUE + '" stroke="none">W</text>' },
    ];
    const PLACEABLE = SYMBOL_TYPES.filter((t) => !t.zone);
    // Signaturen (drehbar). w/h = Grösse in Bildschirmpunkten bei 100 %
    const SIGN_BLUE = '#2E9BE0';
    const SIGN_TEXT = '#1B75BB';
    const FONT = 'font-family="Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle"';
    const circleSign = (id, letter, name, color) => ({ id, name, sign: true, w: 40, h: 40,
      svg: '<circle cx="20" cy="20" r="17" fill="' + color + '" stroke="#000" stroke-width="2.5"/><text x="20" y="27.5" font-size="21" ' + FONT + ' fill="#000">' + letter + '</text>' });
    const VEHICLE_FRAME = '<rect x="1.5" y="1.5" width="69" height="29" rx="2" fill="#fff" stroke="' + SIGN_BLUE + '" stroke-width="3"/>'
      + '<path d="M54 1.5V30.5" stroke="' + SIGN_BLUE + '" stroke-width="3"/><path d="M58 8L67 16L58 24Z" fill="' + SIGN_BLUE + '"/>';
    const vehicle = (id, name, label) => ({ id, name, sign: true, vehicle: true, w: 72, h: 32,
      svg: VEHICLE_FRAME + '<text x="27.5" y="21.5" font-size="15" ' + FONT + ' fill="' + SIGN_TEXT + '">' + label + '</text>' });
    const SIGN_TYPES = [
      circleSign('sig_r', 'R', 'Rettung Mensch/Tier', '#FFD600'),
      circleSign('sig_f', 'F', 'Feuer / Brandherd', '#E53935'),
      circleSign('sig_u', 'U', 'Unfall', '#43A047'),
      circleSign('sig_c', 'C', 'Gefährliche Stoffe', '#FB8C00'),
      circleSign('sig_w', 'W', 'Wasser', '#1E88E5'),
      { id: 'sig_rauch', name: 'Rauch', sign: true, w: 44, h: 32,
        svg: '<path d="M11 29C3 29 2 19 9 17C8 9 17 5 22 11C25 3 37 5 36 13C44 13 44 26 36 29Z" fill="#fff" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>'
          + '<path d="M13 22C16 19 20 24 23 21C26 18 30 23 33 20" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>' },
      { id: 'sig_wind', name: 'Windrichtung', sign: true, w: 40, h: 40,
        svg: '<path d="M20 2L33 17H24.5V38H15.5V17H7Z" fill="#000" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>' },
      vehicle('sig_tlf', 'TLF', 'TLF'),
      vehicle('sig_hlf', 'HLF', 'HLF'),
      vehicle('sig_mt', 'MT', 'MT'),
      vehicle('sig_rw', 'RW', 'RW'),
      vehicle('sig_elw', 'ELW', 'ELW'),
      { id: 'sig_adl', name: 'Autodrehleiter', sign: true, vehicle: true, w: 72, h: 32,
        svg: VEHICLE_FRAME + '<path d="M7 10H49M7 22H49M11 10V22M17 10V22M23 10V22M29 10V22M35 10V22M41 10V22M47 10V22" stroke="' + SIGN_BLUE + '" stroke-width="2.5"/>' },
      { id: 'sig_luefter', name: 'Lüfter', sign: true, w: 72, h: 32,
        svg: '<path d="M3 11H12L23 3V29L12 21H3Z" fill="' + SIGN_BLUE + '"/><path d="M29 4V28M34 4V28" stroke="' + SIGN_BLUE + '" stroke-width="3"/>'
          + '<path d="M39 11H52V4L69 16L52 28V21H39Z" fill="' + SIGN_BLUE + '"/>' },
      { id: 'sig_ms', name: 'Motorspritze', sign: true, w: 36, h: 36,
        svg: '<rect x="1.5" y="1.5" width="33" height="33" fill="#fff" stroke="' + SIGN_BLUE + '" stroke-width="3"/><text x="18" y="23.5" font-size="15" ' + FONT + ' fill="' + SIGN_TEXT + '">MS</text>' },
    ];
    const ITEM_TYPES = PLACEABLE.concat(SIGN_TYPES);
    // Zonen wie im FKS-Schema: Gefahrenzone rot, Sperrzone gelb (beide mit rot-weisser Absperrung),
    // Verkehrsumleitzone nur als Umriss. «order» bestimmt, was oben liegt.
    const LINE_TYPES = [
      { id: 'rettungsachse', name: 'Rettungsachse', color: RA_GREEN, width: 6, closed: false, dashed: true, axis: true, casing: true, order: 3 },
      { id: 'gefahrenzone', name: 'Gefahrenzone', color: '#D32F2F', width: 4, closed: true, dashed: true, barrier: true, fill: '#E8603C', fillOpacity: 0.6, order: 2 },
      { id: 'sperrzone', name: 'Sperrzone', color: '#D32F2F', width: 4, closed: true, dashed: true, barrier: true, fill: '#FFE45C', fillOpacity: 0.45, order: 1 },
      { id: 'verkehrsumleitung', name: 'Verkehrsumleitzone', color: '#F57C00', width: 4, closed: true, dashed: true, order: 0 },
      // Fassade: 4 Punkte, jede Seite in eigener Farbe (1 weiss, 2 grün, 3 schwarz, 4 rot)
      { id: 'fassade', name: 'Fassade', color: '#2E7D32', width: 7, closed: true, facade: true, order: 4 },
      // Freihand mit dem Stift; Farbe pro Strich gespeichert
      { id: 'stift', name: 'Freihand', color: '#D32F2F', width: 4, closed: false, freehand: true, order: 5 },
    ];
    // Rettungsachse gibt es nur bei den Absprachepunkten (Nr. 3), nicht unter «Zonen»
    const ZONE_TYPES = LINE_TYPES.filter((t) => !t.facade && !t.freehand && !t.axis);
    const PEN_COLORS = [
      { c: '#D32F2F', n: 'Rot' }, { c: '#1565C0', n: 'Blau' }, { c: '#000000', n: 'Schwarz' }, { c: '#2E7D32', n: 'Grün' },
      { c: '#F57C00', n: 'Orange' }, { c: '#FFD600', n: 'Gelb' }, { c: '#7B1FA2', n: 'Violett' }, { c: '#FFFFFF', n: 'Weiss' },
    ];
    const PEN_KEY = 'einsatzkarte.stiftfarbe';
    let penColor = (() => { try { return localStorage.getItem(PEN_KEY) || PEN_COLORS[0].c; } catch (e) { return PEN_COLORS[0].c; } })();
    // helle Farben bekommen einen dunklen Rand, damit man sie sieht
    const needsCasing = (c) => c === '#FFFFFF' || c === '#FFD600';
    const FACADE_COLORS = ['#FFFFFF', '#2E7D32', '#000000', '#D32F2F'];
    const FACADE_NAMES = ['weiss', 'grün', 'schwarz', 'rot'];
    // Rubriken für die Auswahl «Einfügen»
    const RUBRICS = [
      { id: 'symbol', name: 'Absprachepunkte (1–6)', mode: () => ({ kind: 'symbol', typeId: null }) },
      { id: 'signatur', name: 'Signaturen', mode: () => ({ kind: 'signatur', group: 'signatur', typeId: null, selId: null }) },
      { id: 'fahrzeug', name: 'Fahrzeuge', mode: () => ({ kind: 'signatur', group: 'fahrzeug', typeId: null, selId: null }) },
      { id: 'zone', name: 'Zonen', mode: () => ({ kind: 'linie', typeId: null, points: [] }) },
      { id: 'fassade', name: 'Fassaden', mode: () => ({ kind: 'linie', typeId: 'fassade', points: [] }) },
      { id: 'stift', name: '✏️ Frei zeichnen', mode: () => ({ kind: 'stift' }) },
    ];
    const rubricOf = (m) => (m.kind === 'linie'
      ? (m.typeId === 'fassade' ? 'fassade' : m.typeId === 'rettungsachse' ? 'symbol' : 'zone')
      : m.kind === 'signatur' ? m.group : m.kind);
    // Signaturen und Fahrzeuge teilen sich die gleiche Technik (drehbar), aber getrennte Auswahl
    const groupOf = (t) => (t.vehicle ? 'fahrzeug' : 'signatur');
    const STORAGE_KEY = 'einsatzkarte.zeichnung.v1';

    const findSymbol = (id) => ITEM_TYPES.find((s) => s.id === id) || PLACEABLE[0];
    const findLine = (id) => LINE_TYPES.find((l) => l.id === id) || LINE_TYPES[0];
    const newId = () => Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    // ---------- Zustand ----------
    let drawing = load();
    let mode = { kind: 'ansehen' };
    let baseKey = 'luftbild';
    let menuOpen = false;
    let viewOnly = false; // geteilte Lage «Nur ansehen»: nichts ändern, nichts speichern

    function load() {
      try {
        const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (d && Array.isArray(d.symbols) && Array.isArray(d.lines)) {
          // Symbole aus früheren Versionen, die es nicht mehr gibt, weglassen
          d.symbols = d.symbols.filter((x) => ITEM_TYPES.some((t) => t.id === x.typeId));
          if (d.pin && !(typeof d.pin.latitude === 'number' && typeof d.pin.longitude === 'number')) delete d.pin;
          return d;
        }
      } catch (e) {}
      return { symbols: [], lines: [] };
    }
    function save() {
      if (viewOnly) return;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(drawing)); } catch (e) {}
    }

    // ---------- Karte ----------
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false,
      maxZoom: 20,
      minZoom: 7,
      maxBounds: [[45.4, 5.4], [48.2, 11.0]],  // siehe updateBounds
      maxBoundsViscosity: 0.8,
      // Karte drehen (Erweiterung leaflet-rotate); mit zwei Fingern erst nach Tipp auf «N»
      rotate: true,
      touchRotate: false,
      rotateControl: false,
      bearing: 0,
    }).setView([46.8, 8.23], 8);

    // Drehung der Karte in Grad (0 = Norden oben)
    const bearingDeg = () => (map.getBearing ? map.getBearing() : 0);
    const needle = document.getElementById('needle');
    function updateCompass() {
      needle.style.transform = 'rotate(' + bearingDeg() + 'deg)';
    }
    map.on('rotate', updateCompass);
    // Die Grenze um die Schweiz rechnet in gedrehter Karte falsch und lässt die Karte
    // beim Verschieben wegspringen. Darum gilt sie nur, solange Norden oben ist.
    const SWISS_BOUNDS = L.latLngBounds([[45.4, 5.4], [48.2, 11.0]]);
    function updateBounds() {
      const want = bearingDeg() === 0;
      if (want !== !!map.options.maxBounds) map.setMaxBounds(want ? SWISS_BOUNDS : L.latLngBounds([]));
    }
    map.on('rotate', updateBounds);
    // Drehen ist gesperrt, damit die Karte beim Zoomen nicht verdreht wird.
    // Tipp auf «N» gibt das Drehen frei, nochmals tippen sperrt es wieder.
    let rotateOn = false;
    let mapLocked = false; // beim Zeichnen mit dem Stift, siehe lockMap
    function setRotateOn(on) {
      rotateOn = on;
      if (map.touchRotate && !mapLocked) (on ? map.touchRotate.enable() : map.touchRotate.disable());
      document.getElementById('compass').classList.toggle('on', on);
      document.getElementById('northBtn').classList.toggle('show', on);
      renderUI();
    }
    document.getElementById('compass').onclick = () => { if (!mapLocked) setRotateOn(!rotateOn); };
    document.getElementById('northBtn').onclick = () => { if (map.setBearing) map.setBearing(0); setRotateOn(false); };
    // Fast nach Norden gedreht: ganz nach Norden einrasten
    document.addEventListener('touchend', () => {
      if (!rotateOn) return;
      const b = bearingDeg();
      if (b !== 0 && (b < 6 || b > 354)) map.setBearing(0);
    });

    let tileLayer = null;
    // Kacheln mit CORS laden, damit sie ins geteilte Bild dürfen. Klappt das nicht, ohne CORS weiter.
    let useCors = true;
    let detailFailed = false;
    // v2: Standard ist neu das Luftbild (frühere Wahl Karte/Grau/Vektor wird nicht übernommen)
    const BASE_KEY = 'einsatzkarte.basiskarte.v2';
    function setBase(key) {
      baseKey = key;
      try { localStorage.setItem(BASE_KEY, key); } catch (e) {}
      if (tileLayer) { map.removeLayer(tileLayer); tileLayer = null; }
      if (BASE_MAPS[key].style) { showVector(BASE_MAPS[key].style); return; }
      hideVector();
      let loadedAny = false;
      const opts = { maxNativeZoom: (!detailFailed && BASE_MAPS[key].nativeMax) || 18, maxZoom: 20 };
      if (useCors) opts.crossOrigin = 'anonymous';
      const layer = tileLayer = L.tileLayer(BASE_MAPS[key].url, opts).addTo(map);
      layer.on('tileload', () => { loadedAny = true; });
      layer.on('tileerror', (e) => {
        // gibt es die feinste Stufe doch nicht: wieder ab 18 vergrössern
        if (e.coords && e.coords.z > 18 && layer.options.maxNativeZoom > 18) {
          detailFailed = true;
          layer.options.maxNativeZoom = 18;
          layer.redraw();
          return;
        }
        if (useCors && !loadedAny) { useCors = false; setBase(baseKey); }
      });
    }

    // ---------- Vektorkarte (MapLibre) ----------
    // Liegt als eigene Fläche unter der Leaflet-Karte und folgt ihr bei Verschieben, Zoomen und Drehen.
    // Wird erst geladen, wenn jemand «Vektor» wählt.
    let gl = null, glDiv = null, glReady = false, glScript = null, glTimer = null;
    function loadMapLibre() {
      if (window.maplibregl) return Promise.resolve();
      if (!glScript) {
        glScript = new Promise((resolve, reject) => {
          const css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = 'vendor/maplibre-gl/maplibre-gl.css';
          document.head.appendChild(css);
          const js = document.createElement('script');
          js.src = 'vendor/maplibre-gl/maplibre-gl.js';
          js.onload = resolve;
          js.onerror = () => { glScript = null; reject(new Error('script')); };
          document.head.appendChild(js);
        });
      }
      return glScript;
    }
    function vectorFailed() {
      if (baseKey !== 'vektor') return;
      clearTimeout(glTimer);
      setBase('luftbild');
      dialog('Vektorkarte geht nicht', 'Die Vektorkarte konnte nicht geladen werden. Es wird das Luftbild gezeigt.', [{ label: 'OK', primary: true }]);
    }
    function showVector(styleUrl) {
      loadMapLibre().then(() => {
        if (baseKey !== 'vektor') return;
        if (!glDiv) {
          glDiv = document.createElement('div');
          glDiv.id = 'glmap';
          map.getContainer().insertBefore(glDiv, map.getContainer().firstChild);
        }
        glDiv.style.display = 'block';
        if (!gl) {
          // mindestens doppelte Auflösung, damit auch das geteilte Bild scharf ist
          gl = new maplibregl.Map({ container: glDiv, style: styleUrl, interactive: false, attributionControl: false,
            preserveDrawingBuffer: true, fadeDuration: 0, pixelRatio: Math.max(2, window.devicePixelRatio || 1) });
          gl.once('load', () => { glReady = true; clearTimeout(glTimer); });
          gl.on('error', () => { if (!glReady) vectorFailed(); });
          glTimer = setTimeout(() => { if (!glReady) vectorFailed(); }, 20000);
        }
        gl.resize();
        syncGl();
      }).catch(vectorFailed);
    }
    function hideVector() {
      if (glDiv) glDiv.style.display = 'none';
    }
    const vectorOn = () => !!(gl && baseKey === 'vektor');
    // MapLibre rechnet mit 512er-Kacheln (eine Zoomstufe weniger) und dreht in die Gegenrichtung
    function syncGl(center, zoom, duration) {
      if (!vectorOn()) return;
      const c = center || map.getCenter();
      const o = { center: [c.lng, c.lat], zoom: (zoom != null ? zoom : map.getZoom()) - 1, bearing: -bearingDeg() };
      if (duration) gl.easeTo(Object.assign(o, { duration, easing: (t) => 1 - Math.pow(1 - t, 3) }));
      else gl.jumpTo(o);
    }
    map.on('move zoom rotate viewreset', () => syncGl());
    // Leaflet zoomt mit einer kurzen Animation: die Vektorkarte im gleichen Takt mitziehen
    map.on('zoomanim', (e) => syncGl(e.center, e.zoom, 250));
    map.on('resize', () => { if (vectorOn()) { gl.resize(); syncGl(); } });

    const drawLayer = L.layerGroup().addTo(map);
    const draftLayer = L.layerGroup().addTo(map);

    // ---------- Standort ----------
    // Der eigene Standort wird nicht als Punkt gezeigt; der Knopf ◎ springt nur dorthin.
    let myPos = null, firstFix = true;

    function startWatching() {
      if (!navigator.geolocation) return;
      navigator.geolocation.watchPosition(
        (pos) => {
          const ll = [pos.coords.latitude, pos.coords.longitude];
          myPos = ll;
          if (firstFix) { firstFix = false; map.flyTo(ll, 17, { duration: 0.8 }); }
        },
        (err) => {
          if (err.code === 1) {
            dialog('Kein Standort', 'Bitte erlaube den Zugriff auf deinen Standort. Auf dem iPhone: Einstellungen › Datenschutz › Ortungsdienste › Safari-Websites › «Beim Verwenden».', [{ label: 'OK', primary: true }]);
          }
        },
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 },
      );
    }

    document.getElementById('locate').onclick = () => {
      if (myPos) map.flyTo(myPos, Math.max(map.getZoom(), 17), { duration: 0.8 });
      else { firstFix = true; startWatching(); }
    };

    // ---------- Zeichnen ----------
    function svgDoc(t, size, height) {
      if (t.sign) {
        return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + (height || size) + '" viewBox="0 0 ' + t.w + ' ' + t.h + '">' + t.svg + '</svg>';
      }
      return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 40 40" fill="none" stroke="' + (t.stroke || FKS_BLUE) + '" stroke-width="4">' + t.svg + '</svg>';
    }
    function symbolHtml(t, size) {
      return '<div class="fksIcon" style="width:' + size + 'px;height:' + size + 'px">' + svgDoc(t, size - 4) + '</div>';
    }
    // Vorschau einer Signatur, so skaliert, dass sie in «max» Punkte passt
    function signHtml(t, max, rotation) {
      const f = Math.min(1, max / Math.max(t.w, t.h));
      return '<div class="signRot" style="transform:rotate(' + (rotation || 0) + 'deg)">' + svgDoc(t, Math.round(t.w * f), Math.round(t.h * f)) + '</div>';
    }
    const scaleOf = (x) => x.scale || 1;
    // Grösse eines gesetzten Eintrags auf der Karte (Rahmen, in dem er gedreht wird)
    // Symbole wachsen und schrumpfen mit der Karte: Grösse gilt für die Zoomstufe beim Setzen (z)
    const REF_ZOOM = 17;
    function viewK(t, s) {
      const base = t.sign ? Math.max(t.w, t.h) : 46;
      let k = scaleOf(s) * Math.pow(2, map.getZoom() - (s.z != null ? s.z : REF_ZOOM));
      // nie ganz verschwinden und nicht riesig werden
      k = Math.max(16 / base, Math.min(240 / base, k));
      return k;
    }
    function itemBox(t, s) {
      return Math.round((t.sign ? Math.max(t.w, t.h) : 46) * viewK(t, s));
    }
    function itemHtml(t, s, selected) {
      const k = viewK(t, s), box = itemBox(t, s);
      const inner = t.sign
        ? '<div class="signRot" style="transform:rotate(' + (s.rotation || 0) + 'deg)">' + svgDoc(t, Math.round(t.w * k), Math.round(t.h * k)) + '</div>'
        : symbolHtml(t, box);
      return '<div class="item' + (selected ? ' sel' : '') + '" style="width:' + box + 'px;height:' + box + 'px">' + inner + '</div>';
    }
    // Symbole auch als Bild bereithalten, für «Ausschnitt teilen»
    const symbolImg = {};
    ITEM_TYPES.forEach((t) => {
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(t.sign ? svgDoc(t, t.w * 4, t.h * 4) : svgDoc(t, 160));
      symbolImg[t.id] = img;
    });

    // Rettungsachse: Positionen für die «R» entlang der Linie und den Pfeil am Ende (in Bildschirmpunkten)
    function axisMarks(pts, k) {
      k = k || 1;
      const marks = [];
      const step = 90 * k;
      let next = 45 * k, walked = 0;
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i];
        const len = Math.hypot(b.x - a.x, b.y - a.y);
        while (next <= walked + len - 20 * k) {
          const f = (next - walked) / len;
          marks.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f });
          next += step;
        }
        walked += len;
      }
      const a = pts[pts.length - 2], b = pts[pts.length - 1];
      return { marks, arrow: { x: b.x, y: b.y, angle: Math.atan2(b.y - a.y, b.x - a.x) } };
    }
    const arrowSvg = (color, size) => '<svg width="' + size + '" height="' + size + '" viewBox="0 0 22 22"><path d="M3 4L19 11L3 18Z" fill="' + color + '" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>';

    function addAxisDecor(layer, latlngs, t, k) {
      if (latlngs.length < 2) return;
      k = k || 1;
      const pts = latlngs.map((ll) => map.latLngToContainerPoint(ll));
      const { marks, arrow } = axisMarks(pts, k);
      const rw = Math.round(18 * k), rh = Math.round(20 * k), as = Math.round(22 * k);
      marks.forEach((m) => {
        L.marker(map.containerPointToLatLng([m.x, m.y]), {
          icon: L.divIcon({ className: 'symbolIcon', html: '<div class="rLabel" style="width:' + rw + 'px;height:' + rh + 'px;font-size:' + Math.round(15 * k) + 'px">R</div>', iconSize: [rw, rh], iconAnchor: [rw / 2, rh / 2] }),
          interactive: false, keyboard: false,
        }).addTo(layer);
      });
      L.marker(map.containerPointToLatLng([arrow.x, arrow.y]), {
        // Pfeil dreht mit der Karte mit, darum die aktuelle Kartendrehung abziehen
        icon: L.divIcon({ className: 'symbolIcon', html: '<div style="transform:rotate(' + (arrow.angle - (bearingDeg() * Math.PI) / 180) + 'rad)">' + arrowSvg(t.color, as) + '</div>', iconSize: [as, as], iconAnchor: [as / 2, as / 2] }),
        interactive: false, keyboard: false, rotateWithView: true,
      }).addTo(layer);
    }

    const dashFor = (t, k) => (t.dashed ? (t.axis ? [14, 10] : [12, 8]).map((d) => d * k) : null);
    function lineStyle(t, k) {
      k = k || 1;
      const dash = dashFor(t, k);
      return { color: t.color, weight: t.width * k, dashArray: dash ? dash.join(' ') : null,
        lineCap: t.barrier ? 'butt' : 'round', lineJoin: 'round',
        fill: !!t.fill, fillColor: t.fill || t.color, fillOpacity: t.fill ? t.fillOpacity : 0 };
    }

    // points: [[lat, lng], ...]; holes: weitere Ringe, die aus der Fläche ausgespart werden
    function shapeFor(t, points, opts, holes, k) {
      const style = Object.assign(lineStyle(t, k), opts || {});
      if (!(t.closed && points.length >= 3)) return L.polyline(points, style);
      return L.polygon(holes && holes.length ? [points].concat(holes) : points, style);
    }

    // Weisse Linie unter der roten Strichlinie: ergibt die rot-weisse Absperrung
    function barrierUnderlay(t, points, k) {
      k = k || 1;
      const o = { color: '#fff', weight: (t.width + 2) * k, fill: false, interactive: false, lineJoin: 'round' };
      return t.closed && points.length >= 3 ? L.polygon(points, o) : L.polyline(points, o);
    }

    function insideRing(pt, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][1], yi = ring[i][0], xj = ring[j][1], yj = ring[j][0];
        if ((yi > pt[0]) !== (yj > pt[0]) && pt[1] < ((xj - xi) * (pt[0] - yi)) / (yj - yi) + xi) inside = !inside;
      }
      return inside;
    }
    const linePts = (line) => line.points.map((p) => [p.latitude, p.longitude]);

    // Zonen von unten nach oben; die Sperrzone spart Gefahrenzonen aus, die ganz in ihr liegen,
    // damit deren Rot nicht vom Gelb überdeckt wird.
    function layeredLines() {
      const gefahr = drawing.lines.filter((l) => l.typeId === 'gefahrenzone' && l.points.length >= 3).map(linePts);
      return drawing.lines
        .slice()
        .sort((a, b) => findLine(a.typeId).order - findLine(b.typeId).order)
        .map((line) => {
          const pts = linePts(line);
          const holes = line.typeId === 'sperrzone' && pts.length >= 3 ? gefahr.filter((g) => g.every((q) => insideRing(q, pts))) : [];
          return { line, t: findLine(line.typeId), pts, holes };
        });
    }

    // Gesetzte Einträge, damit Drehen und Grösse ohne Neuzeichnen der ganzen Karte gehen
    let markers = {};
    const selectedId = () => (mode.kind === 'edit' || mode.kind === 'signatur' ? mode.selId : null);
    const findItem = (id) => drawing.symbols.find((x) => x.id === id);
    const findZone = (id) => drawing.lines.find((x) => x.id === id);

    function iconFor(s) {
      const t = findSymbol(s.typeId), box = itemBox(t, s);
      return L.divIcon({ className: 'symbolIcon', html: itemHtml(t, s, selectedId() === s.id), iconSize: [box, box], iconAnchor: [box / 2, box / 2] });
    }
    function refreshItem(s) {
      const m = markers[s.id];
      if (m) m.setIcon(iconFor(s));
    }

    // Seiten einer Fassade: je eine Linie mit Rand (weiss bekommt schwarzen Rand, sonst weiss)
    function facadeSides(pts, closed) {
      const sides = [];
      for (let i = 1; i < pts.length; i++) sides.push([pts[i - 1], pts[i]]);
      if (closed && pts.length === 4) sides.push([pts[3], pts[0]]);
      return sides;
    }
    function addFacade(layer, pts, k, closed) {
      facadeSides(pts, closed).forEach((seg, i) => {
        L.polyline(seg, { color: i === 0 ? '#000' : '#fff', weight: 7 * k + 4, lineCap: 'round', interactive: false }).addTo(layer);
      });
      facadeSides(pts, closed).forEach((seg, i) => {
        L.polyline(seg, { color: FACADE_COLORS[i], weight: 7 * k, lineCap: 'round', interactive: false }).addTo(layer);
      });
    }

    function renderDrawing() {
      drawLayer.clearLayers();
      markers = {};
      layeredLines().forEach(({ line, t, pts, holes }) => {
        const k = scaleOf(line);
        if (selectedId() === line.id) {
          // ausgewählte Zone gelb leuchtend hinterlegen
          const o = { color: '#FFD600', opacity: 0.55, weight: t.width * k + 14, fill: false, interactive: false, lineJoin: 'round' };
          (t.closed && pts.length >= 3 ? L.polygon(pts, o) : L.polyline(pts, o)).addTo(drawLayer);
        }
        const onTap = (e) => {
          if (mode.kind === 'ansehen' || mode.kind === 'edit') setMode({ kind: 'edit', ref: 'line', selId: line.id });
          else onMapClick(e);
        };
        if (t.facade) {
          addFacade(drawLayer, pts, k, true);
        } else if (t.freehand) {
          const c = line.color || t.color;
          if (needsCasing(c)) L.polyline(pts, { color: '#333', weight: t.width * k + 2, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(drawLayer);
          L.polyline(pts, { color: c, weight: t.width * k, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(drawLayer);
        } else {
          if (t.barrier) barrierUnderlay(t, pts, k).addTo(drawLayer);
          // weisser Rand unter der Rettungsachse, damit sie auf jeder Karte gut sichtbar ist
          if (t.casing) L.polyline(pts, { color: '#fff', weight: t.width * k + 5, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(drawLayer);
          const shape = shapeFor(t, pts, { bubblingMouseEvents: false }, holes, k);
          shape.on('click', onTap);
          shape.addTo(drawLayer);
        }
        // unsichtbare breite Linie, damit man die Zone mit dem Finger gut trifft
        const hitOpts = { opacity: 0, weight: 26, fill: false, bubblingMouseEvents: false };
        (t.closed && pts.length >= 3 ? L.polygon(pts, hitOpts) : L.polyline(pts, hitOpts)).on('click', onTap).addTo(drawLayer);
        if (t.axis) addAxisDecor(drawLayer, line.points.map((p) => L.latLng(p.latitude, p.longitude)), t, k);
      });
      drawing.symbols.forEach((s) => {
        const t = findSymbol(s.typeId);
        const m = L.marker([s.coordinate.latitude, s.coordinate.longitude], { icon: iconFor(s), draggable: mode.kind !== 'stift' && !viewOnly, autoPan: true, zIndexOffset: t.sign ? 0 : 100, rotateWithView: !!t.sign });
        m.on('dragend', () => {
          const ll = m.getLatLng();
          s.coordinate = { latitude: ll.lat, longitude: ll.lng };
          save();
        });
        m.on('click', () => {
          if (mode.kind === 'signatur' && t.sign && groupOf(t) === mode.group) { mode.selId = s.id; renderDrawing(); renderUI(); }
          else if (mode.kind === 'ansehen' || mode.kind === 'edit') setMode({ kind: 'edit', ref: 'symbol', selId: s.id });
          // beim Zeichnen zählt ein Tipp auf einen Eintrag wie ein Tipp auf die Karte
          else if (mode.kind === 'linie' || mode.kind === 'symbol') onMapClick({ latlng: m.getLatLng() });
        });
        m.addTo(drawLayer);
        markers[s.id] = m;
      });
      if (drawing.pin) {
        const pin = L.marker([drawing.pin.latitude, drawing.pin.longitude], { icon: pinIcon(drawing.pin.label), zIndexOffset: 1000, keyboard: false });
        pin.on('click', () => {
          if (viewOnly || (mode.kind !== 'ansehen' && mode.kind !== 'edit')) return;
          dialog('Adress-Nadel', (drawing.pin.label || '') + '\n\nMöchtest du die Nadel löschen?', [
            { label: 'Löschen', danger: true, onClick: () => { delete drawing.pin; save(); renderDrawing(); } },
          ], true);
        });
        pin.addTo(drawLayer);
      }
    }

    // ---------- Gesuchte Adresse: rote Nadel ----------
    const PIN_SVG = '<svg width="34" height="44" viewBox="0 0 34 44"><path d="M17 43C17 43 3 26 3 16a14 14 0 0 1 28 0c0 10-14 27-14 27z" fill="#D32F2F" stroke="#fff" stroke-width="2.5"/><circle cx="17" cy="16" r="5.5" fill="#fff"/></svg>';
    function pinIcon(label) {
      return L.divIcon({ className: 'symbolIcon', html: '<div class="pin">' + PIN_SVG + (label ? '<span>' + esc(label) + '</span>' : '') + '</div>', iconSize: [0, 0], iconAnchor: [0, 0] });
    }

    function renderDraft() {
      draftLayer.clearLayers();
      if (mode.kind !== 'linie' || !mode.typeId || mode.points.length === 0) return;
      const t = findLine(mode.typeId);
      if (t.facade) addFacade(draftLayer, mode.points, 1, true);
      else {
        if (t.barrier) barrierUnderlay(t, mode.points).addTo(draftLayer);
        if (t.casing && mode.points.length > 1) L.polyline(mode.points, { color: '#fff', weight: t.width + 5, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(draftLayer);
        shapeFor(t, mode.points, { interactive: false }).addTo(draftLayer);
      }
      if (t.axis) addAxisDecor(draftLayer, mode.points.map((p) => L.latLng(p[0], p[1])), t);
      mode.points.forEach((p) => {
        L.marker(p, {
          icon: L.divIcon({ className: 'symbolIcon', html: '<div class="draftDot" style="border-color:' + t.color + '"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }),
          interactive: false,
        }).addTo(draftLayer);
      });
    }

    function onMapClick(e) {
      const ll = e.latlng;
      if (mode.kind === 'symbol' && mode.typeId) {
        drawing.symbols.push({ id: newId(), typeId: mode.typeId, coordinate: { latitude: ll.lat, longitude: ll.lng }, z: map.getZoom() });
        // nur einmal setzen; für ein weiteres muss man es unten wieder antippen
        mode.typeId = null;
        save();
        renderDrawing();
        renderUI();
      } else if (mode.kind === 'signatur' && mode.typeId) {
        // neue Signatur übernimmt die Grösse der zuletzt gesetzten
        const last = findItem(mode.selId);
        const s = { id: newId(), typeId: mode.typeId, coordinate: { latitude: ll.lat, longitude: ll.lng }, rotation: 0, scale: last ? scaleOf(last) : 1, z: map.getZoom() };
        drawing.symbols.push(s);
        mode.selId = s.id;
        mode.typeId = null;
        save();
        renderDrawing();
        renderUI();
      } else if (mode.kind === 'linie' && mode.typeId) {
        mode.points.push([ll.lat, ll.lng]);
        // Fassade ist nach dem 4. Punkt automatisch fertig
        if (mode.typeId === 'fassade' && mode.points.length === 4) { finishLine(); return; }
        renderDraft();
        renderUI();
      } else if (mode.kind === 'edit') {
        setMode({ kind: 'ansehen' });
      }
    }
    map.on('click', onMapClick);

    // ---------- Frei zeichnen mit dem Stift ----------
    let stroke = null; // { id, points: [L.LatLng], last: {x,y}, line: L.Polyline }
    const mapEl = document.getElementById('map');
    function endStroke(keep) {
      if (!stroke) return;
      draftLayer.removeLayer(stroke.line);
      if (stroke.casing) draftLayer.removeLayer(stroke.casing);
      if (keep && stroke.points.length >= 2) {
        drawing.lines.push({ id: newId(), typeId: 'stift', color: penColor, points: stroke.points.map((ll) => ({ latitude: ll.lat, longitude: ll.lng })) });
        save();
        renderDrawing();
        renderUI();
      }
      stroke = null;
    }
    mapEl.addEventListener('pointerdown', (e) => {
      if (mode.kind !== 'stift') return;
      // nur der erste Finger zeichnet; ein zweiter Finger oder der Handballen stört den Strich nicht
      if (stroke) return;
      const ll = map.mouseEventToLatLng(e);
      const opts = { color: penColor, weight: 4, lineCap: 'round', lineJoin: 'round', interactive: false };
      stroke = { id: e.pointerId, points: [ll], last: { x: e.clientX, y: e.clientY }, line: L.polyline([ll], opts).addTo(draftLayer) };
      if (needsCasing(penColor)) {
        stroke.casing = L.polyline([ll], Object.assign({}, opts, { color: '#333', weight: 6 })).addTo(draftLayer);
        stroke.line.bringToFront();
      }
    }, true);
    mapEl.addEventListener('pointermove', (e) => {
      if (!stroke || e.pointerId !== stroke.id) return;
      if (Math.hypot(e.clientX - stroke.last.x, e.clientY - stroke.last.y) < 3) return;
      stroke.last = { x: e.clientX, y: e.clientY };
      const ll = map.mouseEventToLatLng(e);
      stroke.points.push(ll);
      stroke.line.addLatLng(ll);
      if (stroke.casing) stroke.casing.addLatLng(ll);
    }, true);
    const penUp = (e) => { if (stroke && e.pointerId === stroke.id) endStroke(true); };
    mapEl.addEventListener('pointerup', penUp, true);
    mapEl.addEventListener('pointercancel', penUp, true);
    // «R» und Pfeil der Rettungsachse nach dem Zoomen neu verteilen
    map.on('zoomend', () => { renderDrawing(); renderDraft(); });
    // Symbolgrösse schon während des Zoomens mitführen
    map.on('zoom', () => drawing.symbols.forEach(refreshItem));

    function finishLine() {
      const t = findLine(mode.typeId);
      const needed = t.closed ? 3 : 2;
      if (mode.points.length < needed) {
        dialog('Zu wenig Punkte', 'Für eine ' + t.name + ' braucht es mindestens ' + needed + ' Punkte.', [{ label: 'OK', primary: true }]);
        return;
      }
      drawing.lines.push({ id: newId(), typeId: t.id, points: mode.points.map((p) => ({ latitude: p[0], longitude: p[1] })) });
      save();
      // nach der Rettungsachse zurück zu den Absprachepunkten
      setMode(t.axis ? { kind: 'symbol', typeId: null } : { kind: 'linie', typeId: t.facade ? 'fassade' : null, points: [] });
    }

    // ---------- Oberfläche ----------
    function setMode(m) {
      if (viewOnly && m.kind !== 'ansehen') return;
      mode = m;
      lockMap(mode.kind === 'stift');
      // ohne Verschieben würde der Browser sonst selbst wischen (zurück, scrollen)
      document.getElementById('map').classList.toggle('penMode', mode.kind === 'stift');
      renderDrawing();
      renderDraft();
      renderUI();
    }

    // Beim Zeichnen mit dem Stift ist die Karte ganz fest: kein Verschieben, Zoomen oder Drehen.
    // Sonst bricht ein zweiter Finger oder der Handballen den Strich ab und die Karte rutscht weg.
    function lockMap(on) {
      if (on === mapLocked) return;
      mapLocked = on;
      const handlers = ['dragging', 'touchZoom', 'doubleClickZoom', 'scrollWheelZoom', 'shiftKeyRotate', 'boxZoom', 'keyboard'];
      if (on) {
        handlers.forEach((h) => map[h] && map[h].disable());
        if (map.touchRotate) map.touchRotate.disable();
        if (map.touchGestures) map.touchGestures.disable();
      } else {
        if (map.touchGestures) map.touchGestures.enable();
        handlers.forEach((h) => map[h] && map[h].enable());
        if (map.touchRotate && rotateOn) map.touchRotate.enable();
      }
    }

    // Grauer Hinweis nur beim Einfügen (Absprachepunkte, Signaturen, Fahrzeuge, Zonen, Fassaden, Stift)
    function hintText() {
      if (mode.kind === 'stift') return 'Mit dem Finger zeichnen. Die Karte ist fest; zum Verschieben «Fertig» tippen.';
      if (mode.kind === 'symbol') {
        return mode.typeId ? 'Tippe auf die Karte, um «' + findSymbol(mode.typeId).name + '» zu setzen.' : 'Wähle unten einen Absprachepunkt aus.';
      }
      if (mode.kind === 'signatur') {
        if (!mode.typeId) {
          const what = mode.group === 'fahrzeug' ? 'ein Fahrzeug' : 'eine Signatur';
          return mode.selId && findItem(mode.selId)
            ? 'Unten drehen und Grösse anpassen. Für ein weiteres Symbol unten wieder eines antippen.'
            : 'Wähle unten ' + what + ' aus.';
        }
        return 'Tippe auf die Karte, um «' + findSymbol(mode.typeId).name + '» zu setzen.';
      }
      if (mode.kind === 'linie') {
        if (!mode.typeId) return 'Wähle unten die Art der Zone.';
        const t = findLine(mode.typeId);
        if (t.facade) {
          const n = mode.points.length;
          return n === 0
            ? 'Tippe 4 Ecken der Fassade auf die Karte. Seite 1 wird weiss, 2 grün, 3 schwarz, 4 rot.'
            : 'Ecke ' + (n + 1) + ' von 4 tippen' + (n >= 1 ? ' (Seite ' + n + ' wird ' + FACADE_NAMES[n - 1] + ').' : '.');
        }
        return mode.points.length === 0
          ? 'Tippe Punkt für Punkt auf die Karte, um die ' + t.name + ' zu zeichnen.' + (t.axis ? ' Der Pfeil zeigt zum letzten Punkt.' : '')
          : mode.points.length + ' Punkt(e) gesetzt. Weiter tippen oder «' + (t.axis ? 'Achse' : 'Zone') + ' fertig» drücken.';
      }
      // Empfänger einer geteilten Lage soll wissen, dass er nur schaut
      if (viewOnly) return 'Geteilte Lage: nur ansehen. Deine eigene Zeichnung bleibt unverändert.';
      return '';
    }

    const ICON_MENU = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';
    const ICON_SHARE = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
    const ICON_TRASH = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
    function button(label, cls, onClick) {
      const b = document.createElement('button');
      b.className = 'btn' + (cls ? ' ' + cls : '');
      b.textContent = label;
      b.onclick = onClick;
      return b;
    }
    function row(children) {
      const r = document.createElement('div');
      r.className = 'row';
      children.forEach((c) => r.appendChild(c));
      return r;
    }

    // Regler zum Drehen (nur Signaturen) und Knöpfe für die Grösse
    function adjustControls(item, isLine) {
      const t = isLine ? findLine(item.typeId) : findSymbol(item.typeId);
      const redraw = () => (isLine ? renderDrawing() : refreshItem(item));
      const out = [];
      if (!isLine && t.sign) {
        // Regler startet in der Mitte (0°); von dort bis 360° nach links oder rechts
        const r = document.createElement('div');
        r.className = 'adjRow';
        r.innerHTML = '<span class="adjLabel">Drehen</span><button class="mini">↺</button><input type="range" min="-360" max="360" step="1" class="center" /><button class="mini">↻</button><span class="adjVal"></span>';
        const [left, right] = r.querySelectorAll('button');
        const slider = r.querySelector('input');
        const val = r.querySelector('.adjVal');
        const rot = item.rotation || 0;
        let v = rot > 180 ? rot - 360 : rot;
        const set = (deg) => {
          v = Math.max(-360, Math.min(360, Math.round(deg)));
          item.rotation = ((v % 360) + 360) % 360;
          slider.value = v;
          val.textContent = (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v) + '°';
          redraw();
        };
        slider.oninput = () => set(+slider.value);
        slider.onchange = save;
        left.onclick = () => { set(v - 15); save(); };
        right.onclick = () => { set(v + 15); save(); };
        set(v);
        out.push(r);
      }
      const r = document.createElement('div');
      r.className = 'adjRow';
      r.innerHTML = '<span class="adjLabel">Grösse</span><button class="mini">−</button><input type="range" min="50" max="300" step="5" /><button class="mini">+</button><span class="adjVal"></span>';
      const [minus, plus] = r.querySelectorAll('button');
      const slider = r.querySelector('input');
      const val = r.querySelector('.adjVal');
      const setPct = (pct) => {
        pct = Math.max(50, Math.min(300, Math.round(pct / 5) * 5));
        item.scale = pct / 100;
        slider.value = pct;
        val.textContent = pct + ' %';
        redraw();
      };
      slider.oninput = () => setPct(+slider.value);
      slider.onchange = save;
      minus.onclick = () => { setPct(scaleOf(item) * 100 - 10); save(); };
      plus.onclick = () => { setPct(scaleOf(item) * 100 + 10); save(); };
      setPct(scaleOf(item) * 100);
      out.push(r);
      return out;
    }

    function askDelete(item, isLine) {
      const t = isLine ? findLine(item.typeId) : findSymbol(item.typeId);
      dialog(t.name, 'Möchtest du diesen Eintrag löschen?', [
        { label: 'Abbrechen' },
        { label: 'Löschen', danger: true, onClick: () => {
          if (isLine) drawing.lines = drawing.lines.filter((l) => l.id !== item.id);
          else drawing.symbols = drawing.symbols.filter((x) => x.id !== item.id);
          save();
          setMode(mode.kind === 'signatur' ? { kind: 'signatur', group: mode.group, typeId: mode.typeId, selId: null } : { kind: 'ansehen' });
        } },
      ]);
    }

    function renderUI() {
      document.getElementById('hint').textContent = hintText();
      const panel = document.getElementById('panel');
      panel.innerHTML = '';

      // Auswahlfeld oben: zwischen den Rubriken wechseln
      if (mode.kind === 'symbol' || mode.kind === 'signatur' || mode.kind === 'linie' || mode.kind === 'stift') {
        const sel = document.createElement('select');
        sel.className = 'rubric';
        sel.innerHTML = RUBRICS.map((r) => '<option value="' + r.id + '">' + esc(r.name) + ' ▾</option>').join('');
        sel.value = rubricOf(mode);
        sel.onchange = () => setMode(RUBRICS.find((r) => r.id === sel.value).mode());
        panel.appendChild(sel);
      }

      if (mode.kind === 'ansehen' && viewOnly) {
        const optBtn = button('', 'primary icon', optionsMenu);
        optBtn.innerHTML = ICON_MENU;
        optBtn.setAttribute('aria-label', 'Optionen');
        const bar = row([optBtn, button('Zurück zu meiner Karte', 'add', leaveViewOnly)]);
        bar.classList.add('mainBar');
        panel.appendChild(bar);
      } else if (mode.kind === 'ansehen') {
        if (menuOpen) {
          const menu = document.createElement('div');
          menu.className = 'menu';
          RUBRICS.forEach((r) => {
            const b = button(r.name, 'menuItem', () => { menuOpen = false; setMode(r.mode()); });
            menu.appendChild(b);
          });
          panel.appendChild(menu);
          panel.appendChild(row([button('Abbrechen', '', () => { menuOpen = false; renderUI(); })]));
          finishPanel(panel);
          return;
        }
        const optBtn = button('', 'primary icon', optionsMenu);
        optBtn.innerHTML = ICON_MENU;
        optBtn.setAttribute('aria-label', 'Optionen');
        const plusBtn = button('＋', 'add plus', () => { menuOpen = true; renderUI(); });
        plusBtn.setAttribute('aria-label', 'Einfügen');
        const clearBtn = button('', 'danger icon', () => {
          if (!drawing.symbols.length && !drawing.lines.length && !drawing.pin) return;
          dialog('Alles löschen?', 'Alle Absprachepunkte, Signaturen, Fahrzeuge, Zonen, Fassaden, Zeichnungen und die Adress-Nadel werden entfernt.', [
            { label: 'Abbrechen' },
            { label: 'Alles löschen', danger: true, onClick: () => { drawing = { symbols: [], lines: [] }; save(); renderDrawing(); } },
          ]);
        });
        clearBtn.innerHTML = ICON_TRASH;
        clearBtn.setAttribute('aria-label', 'Alles löschen');
        const bar = row([optBtn, plusBtn, clearBtn]);
        bar.classList.add('mainBar');
        panel.appendChild(bar);
      }

      if (mode.kind === 'symbol') {
        const pal = document.createElement('div');
        pal.className = 'palette';
        SYMBOL_TYPES.forEach((t) => {
          const item = document.createElement('div');
          item.className = 'palItem' + (mode.typeId === t.id ? ' active' : '');
          item.innerHTML = '<b class="nr">' + t.nr + '</b>' + symbolHtml(t, 42) + '<span>' + esc(t.name) + '</span>';
          // Nr. 3 ist keine Markierung, sondern eine Linie: direkt zum Zeichnen der Rettungsachse
          item.onclick = () => setMode(t.zone ? { kind: 'linie', typeId: t.zone, points: [] } : { kind: 'symbol', typeId: t.id });
          pal.appendChild(item);
        });
        panel.appendChild(pal);
        panel.appendChild(row([button('Fertig', 'primary', () => setMode({ kind: 'ansehen' }))]));
        const active = pal.querySelector('.active');
        if (active) active.scrollIntoView({ inline: 'nearest', block: 'nearest' });
      }

      if (mode.kind === 'signatur') {
        const pal = document.createElement('div');
        pal.className = 'palette';
        SIGN_TYPES.filter((t) => groupOf(t) === mode.group).forEach((t) => {
          const item = document.createElement('div');
          item.className = 'palItem' + (mode.typeId === t.id ? ' active' : '');
          item.innerHTML = '<div class="palPic">' + signHtml(t, 54) + '</div><span>' + esc(t.name) + '</span>';
          item.onclick = () => setMode({ kind: 'signatur', group: mode.group, typeId: t.id, selId: mode.selId });
          pal.appendChild(item);
        });
        panel.appendChild(pal);
        const sel = findItem(mode.selId);
        if (sel) adjustControls(sel, false).forEach((el) => panel.appendChild(el));
        panel.appendChild(row(sel
          ? [button('Löschen', 'danger', () => askDelete(sel, false)), button('Fertig', 'primary', () => setMode({ kind: 'ansehen' }))]
          : [button('Fertig', 'primary', () => setMode({ kind: 'ansehen' }))]));
        const active = pal.querySelector('.active');
        if (active) active.scrollIntoView({ inline: 'nearest', block: 'nearest' });
      }

      if (mode.kind === 'stift') {
        const colors = document.createElement('div');
        colors.className = 'colors';
        PEN_COLORS.forEach((pc) => {
          const b = document.createElement('button');
          b.style.background = pc.c;
          b.setAttribute('aria-label', pc.n);
          if (pc.c === penColor) b.className = 'active';
          b.onclick = () => { penColor = pc.c; try { localStorage.setItem(PEN_KEY, penColor); } catch (e) {} renderUI(); };
          colors.appendChild(b);
        });
        panel.appendChild(colors);
        const mine = drawing.lines.filter((l) => l.typeId === 'stift');
        panel.appendChild(row([
          button('Letzten Strich weg', '', () => {
            const last = mine[mine.length - 1];
            if (!last) return;
            drawing.lines = drawing.lines.filter((l) => l !== last);
            save(); renderDrawing(); renderUI();
          }),
          button('Fertig', 'primary', () => setMode({ kind: 'ansehen' })),
        ]));
      }

      if (mode.kind === 'edit') {
        const isLine = mode.ref === 'line';
        const item = isLine ? findZone(mode.selId) : findItem(mode.selId);
        if (!item) { mode = { kind: 'ansehen' }; renderUI(); return; }
        const t = isLine ? findLine(item.typeId) : findSymbol(item.typeId);
        const title = document.createElement('div');
        title.className = 'editTitle';
        title.textContent = t.name;
        panel.appendChild(title);
        adjustControls(item, isLine).forEach((el) => panel.appendChild(el));
        panel.appendChild(row([
          button('Löschen', 'danger', () => askDelete(item, isLine)),
          button('Fertig', 'primary', () => setMode({ kind: 'ansehen' })),
        ]));
      }

      if (mode.kind === 'linie') {
        const locked = mode.points.length > 0;
        const choice = (t) => {
          const c = document.createElement('div');
          const selected = mode.typeId === t.id;
          c.className = 'lineChoice' + (locked && !selected ? ' disabled' : '');
          if (selected) { c.style.borderColor = t.color; c.style.background = t.color + '22'; }
          const sample = t.fill
            ? '<div style="width:36px;height:14px;background:' + t.fill + Math.round(t.fillOpacity * 255).toString(16) + ';border:2px dashed ' + t.color + '"></div>'
            : t.axis
            ? '<div style="width:10px;height:4px;background:' + t.color + '"></div><b style="color:' + t.color + ';font-size:12px;line-height:8px">R</b><div style="width:10px;height:4px;background:' + t.color + '"></div><div style="width:0;height:0;border-left:8px solid ' + t.color + ';border-top:5px solid transparent;border-bottom:5px solid transparent"></div>'
            : t.dashed
            ? [0, 1, 2].map(() => '<div style="width:10px;height:4px;background:' + t.color + '"></div>').join('')
            : '<div style="width:38px;height:5px;border-radius:3px;background:' + t.color + '"></div>';
          c.innerHTML = '<div class="sample">' + sample + '</div><span>' + esc(t.name) + '</span>';
          c.onclick = () => { if (!locked) setMode({ kind: 'linie', typeId: t.id, points: [] }); };
          return c;
        };
        if (mode.typeId === 'fassade') {
          const legend = document.createElement('div');
          legend.className = 'legend';
          legend.innerHTML = FACADE_COLORS.map((c, i) => '<div><i style="background:' + c + '"></i>' + (i + 1) + ' ' + FACADE_NAMES[i] + '</div>').join('');
          panel.appendChild(legend);
        }
        const isAxis = mode.typeId === 'rettungsachse';
        if (isAxis) panel.appendChild(row([choice(findLine('rettungsachse'))]));
        else if (mode.typeId !== 'fassade') for (let k = 0; k < ZONE_TYPES.length; k += 2) panel.appendChild(row(ZONE_TYPES.slice(k, k + 2).map(choice)));
        panel.appendChild(row(locked
          ? [
              button('Punkt zurück', '', () => { mode.points.pop(); renderDraft(); renderUI(); }),
              button('Verwerfen', 'danger', () => { mode.points = []; renderDraft(); renderUI(); }),
            ].concat(mode.typeId === 'fassade' ? [] : [button(isAxis ? 'Achse fertig' : 'Zone fertig', 'primary', finishLine)])
          : isAxis
          ? [button('Zurück', '', () => setMode({ kind: 'symbol', typeId: null })), button('Fertig', 'primary', () => setMode({ kind: 'ansehen' }))]
          : [button('Fertig', 'primary', () => setMode({ kind: 'ansehen' }))]));
      }

      finishPanel(panel);
    }

    // Standort-Knopf und Quellenangabe über dem Werkzeug-Bereich halten
    function finishPanel(panel) {
      const h = panel.offsetHeight;
      document.getElementById('locate').style.bottom = (h + 14) + 'px';
      document.getElementById('compass').style.bottom = (h + 74) + 'px';
      document.getElementById('northBtn').style.bottom = (h + 79) + 'px';
      document.getElementById('attribution').style.bottom = (h + 6) + 'px';
    }

    // ---------- Ausschnitt als Bild teilen ----------
    function snapshotCanvas() {
      const container = map.getContainer();
      const box = container.getBoundingClientRect();
      const w = Math.round(box.width), h = Math.round(box.height);
      // möglichst scharf: mindestens doppelte, auf dem iPhone dreifache Auflösung
      // (aber unter der Grenze, die Safari für ein Bild erlaubt)
      let scale = Math.max(2, Math.min(window.devicePixelRatio || 1, 3));
      scale = Math.min(scale, Math.sqrt(16e6 / (w * (h + 44))));
      const footer = 44;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round((h + footer) * scale);
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.scale(scale, scale);
      ctx.fillStyle = '#e8e8e8';
      ctx.fillRect(0, 0, w, h);

      // Kartenkacheln so übernehmen, wie sie gerade auf dem Bildschirm liegen
      // (über die Ecken jeder Kachel, damit es auch bei gedrehter Karte stimmt)
      if (vectorOn()) {
        syncGl();
        gl.redraw();
        ctx.drawImage(gl.getCanvas(), 0, 0, w, h);
      }
      Object.values(tileLayer ? tileLayer._tiles || {} : {}).forEach((tile) => {
        const img = tile.el;
        if (!img || !img.complete || !img.naturalWidth || !tile.coords) return;
        const z = tile.coords.z, size = 256;
        const corner = (dx, dy) => map.latLngToContainerPoint(map.unproject([(tile.coords.x + dx) * size, (tile.coords.y + dy) * size], z));
        const nw = corner(0, 0), ne = corner(1, 0), sw = corner(0, 1);
        ctx.save();
        ctx.transform(ne.x - nw.x, ne.y - nw.y, sw.x - nw.x, sw.y - nw.y, nw.x, nw.y);
        ctx.drawImage(img, -0.002, -0.002, 1.004, 1.004);
        ctx.restore();
      });

      const pt = (lat, lng) => map.latLngToContainerPoint([lat, lng]);

      // Zonen (gleiche Reihenfolge und Aussparungen wie auf der Karte)
      layeredLines().forEach(({ line, t, pts: ll, holes }) => {
        const k = scaleOf(line);
        const pts = ll.map((p) => pt(p[0], p[1]));
        if (pts.length < 2) return;
        if (t.freehand) {
          const c = line.color || t.color;
          ctx.setLineDash([]);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          [needsCasing(c) ? '#333' : null, c].forEach((col, pass) => {
            if (!col) return;
            ctx.beginPath();
            pts.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)));
            ctx.lineWidth = t.width * k + (pass ? 0 : 2);
            ctx.strokeStyle = col;
            ctx.stroke();
          });
          return;
        }
        if (t.facade) {
          ctx.setLineDash([]);
          ctx.lineCap = 'round';
          [0, 1].forEach((pass) => facadeSides(pts, true).forEach((seg, i) => {
            ctx.beginPath();
            ctx.moveTo(seg[0].x, seg[0].y);
            ctx.lineTo(seg[1].x, seg[1].y);
            ctx.lineWidth = pass ? 7 * k : 7 * k + 4;
            ctx.strokeStyle = pass ? FACADE_COLORS[i] : i === 0 ? '#000' : '#fff';
            ctx.stroke();
          }));
          return;
        }
        const closed = t.closed && pts.length >= 3;
        const ring = (r) => { r.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); if (closed) ctx.closePath(); };
        if (closed && t.fill) {
          ctx.beginPath();
          ring(pts);
          holes.forEach((h) => ring(h.map((p) => pt(p[0], p[1]))));
          ctx.globalAlpha = t.fillOpacity;
          ctx.fillStyle = t.fill;
          ctx.fill('evenodd');
          ctx.globalAlpha = 1;
        }
        ctx.beginPath();
        ring(pts);
        ctx.lineJoin = 'round';
        if (t.barrier || t.casing) {
          ctx.setLineDash([]);
          ctx.lineCap = 'round';
          ctx.lineWidth = (t.width + (t.casing ? 5 : 2)) * k;
          ctx.strokeStyle = '#fff';
          ctx.stroke();
        }
        ctx.setLineDash(dashFor(t, k) || []);
        ctx.lineWidth = t.width * k;
        ctx.lineCap = t.barrier ? 'butt' : 'round';
        ctx.strokeStyle = t.color;
        ctx.stroke();
        ctx.setLineDash([]);
        if (t.axis) {
          const { marks, arrow } = axisMarks(pts, k);
          ctx.font = '800 ' + Math.round(15 * k) + 'px -apple-system, BlinkMacSystemFont, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          marks.forEach((m) => {
            ctx.fillStyle = '#fff';
            ctx.fillRect(m.x - 7 * k, m.y - 9 * k, 14 * k, 18 * k);
            ctx.fillStyle = t.color;
            ctx.fillText('R', m.x, m.y + k);
          });
          ctx.save();
          ctx.translate(arrow.x, arrow.y);
          ctx.rotate(arrow.angle);
          ctx.scale(k, k);
          ctx.beginPath();
          ctx.moveTo(9, 0); ctx.lineTo(-9, -8); ctx.lineTo(-9, 8); ctx.closePath();
          ctx.fillStyle = t.color;
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#fff';
          ctx.stroke();
          ctx.restore();
        }
      });

      // Signaturen zuerst, Absprachepunkte darüber (wie auf der Karte)
      drawing.symbols
        .slice()
        .sort((a, b) => (findSymbol(a.typeId).sign ? 0 : 1) - (findSymbol(b.typeId).sign ? 0 : 1))
        .forEach((s) => {
          const t = findSymbol(s.typeId);
          const p = pt(s.coordinate.latitude, s.coordinate.longitude);
          const k = viewK(t, s);
          const img = symbolImg[t.id];
          ctx.save();
          ctx.translate(p.x, p.y);
          if (t.sign) {
            ctx.rotate((((s.rotation || 0) + bearingDeg()) * Math.PI) / 180);
            ctx.shadowColor = 'rgba(0,0,0,.5)';
            ctx.shadowBlur = 2;
            ctx.shadowOffsetY = 1;
            const w = t.w * k, hh = t.h * k;
            if (img && img.complete) ctx.drawImage(img, -w / 2, -hh / 2, w, hh);
            ctx.restore();
            return;
          }
          const size = 46 * k;
          ctx.shadowColor = 'rgba(0,0,0,.4)';
          ctx.shadowBlur = 3;
          ctx.shadowOffsetY = 1;
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(-size / 2, -size / 2, size, size, 6 * k);
          else ctx.rect(-size / 2, -size / 2, size, size);
          ctx.fill();
          ctx.shadowColor = 'transparent';
          if (img && img.complete) ctx.drawImage(img, -size / 2 + 2 * k, -size / 2 + 2 * k, size - 4 * k, size - 4 * k);
          ctx.restore();
        });

      // Adress-Nadel zuoberst
      if (drawing.pin) {
        const p = pt(drawing.pin.latitude, drawing.pin.longitude);
        ctx.save();
        ctx.translate(p.x - 17, p.y - 44);
        ctx.shadowColor = 'rgba(0,0,0,.4)';
        ctx.shadowBlur = 3;
        ctx.shadowOffsetY = 1;
        ctx.fill(new Path2D('M17 43C17 43 3 26 3 16a14 14 0 0 1 28 0c0 10-14 27-14 27z'));
        ctx.restore();
        ctx.save();
        ctx.translate(p.x - 17, p.y - 44);
        const body = new Path2D('M17 43C17 43 3 26 3 16a14 14 0 0 1 28 0c0 10-14 27-14 27z');
        ctx.fillStyle = '#D32F2F';
        ctx.fill(body);
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#fff';
        ctx.stroke(body);
        ctx.beginPath(); ctx.arc(17, 16, 5.5, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
        ctx.restore();
        if (drawing.pin.label) {
          ctx.font = '700 14px -apple-system, BlinkMacSystemFont, sans-serif';
          const tw = ctx.measureText(drawing.pin.label).width;
          const bw = tw + 20, bh = 26, bx = p.x - bw / 2, by = p.y - 48 - bh;
          ctx.fillStyle = '#fff';
          ctx.strokeStyle = '#D32F2F';
          ctx.lineWidth = 2;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 8); else ctx.rect(bx, by, bw, bh);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#222';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(drawing.pin.label, p.x, by + bh / 2 + 1);
        }
      }

      // Nordpfeil oben links, wenn die Karte gedreht ist
      if (bearingDeg() !== 0) {
        ctx.save();
        ctx.translate(34, 34);
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI * 2); ctx.fill();
        ctx.rotate((bearingDeg() * Math.PI) / 180);
        ctx.fillStyle = '#D32F2F';
        ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(7, 4); ctx.lineTo(-7, 4); ctx.closePath(); ctx.fill();
        ctx.font = '800 12px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('N', 0, 14);
        ctx.restore();
      }

      // Logo oben rechts
      const logo = document.getElementById('logo');
      if (logo.complete && logo.naturalWidth) ctx.drawImage(logo, w - 58, 10, 46, 48);

      // Fusszeile mit Datum, Kartenmitte und Quelle
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, h, w, footer);
      const c = map.getCenter();
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const stamp = pad(now.getDate()) + '.' + pad(now.getMonth() + 1) + '.' + now.getFullYear() + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
      ctx.fillStyle = '#222';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = '600 13px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillText('Einsatzkarte · ' + stamp, 10, h + 14);
      ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillStyle = '#555';
      ctx.fillText('Kartenmitte ' + c.lat.toFixed(5) + ', ' + c.lng.toFixed(5) + ' · © swisstopo', 10, h + 32);
      return { canvas, stamp, center: c };
    }

    function closeShare() {
      document.getElementById('shareView').classList.remove('open');
      document.getElementById('shareImg').classList.remove('qr');
    }

    // ---------- Lage teilen (Link, in dem die ganze Zeichnung steckt) ----------
    // Koordinaten als ganze Zahlen in 1/100000 Grad (~1 m), Linienpunkte als Abstände zum Vorgänger: hält den Link kurz
    const toInt = (n) => Math.round(n * 1e5);
    // Freihand-Striche für den Link vereinfachen (Punkte weglassen, die weniger als ~2 m von der Linie abweichen):
    // macht Link und QR-Code viel kürzer, ohne dass man es sieht
    function simplify(pts, tol) {
      if (pts.length < 3) return pts;
      const keep = new Array(pts.length).fill(false);
      keep[0] = keep[pts.length - 1] = true;
      const stack = [[0, pts.length - 1]];
      while (stack.length) {
        const [i, j] = stack.pop();
        const [ax, ay] = pts[i], [bx, by] = pts[j];
        const len = Math.hypot(bx - ax, by - ay) || 1;
        let best = -1, dmax = tol;
        for (let k = i + 1; k < j; k++) {
          const d = Math.abs((bx - ax) * (ay - pts[k][1]) - (ax - pts[k][0]) * (by - ay)) / len;
          if (d > dmax) { dmax = d; best = k; }
        }
        if (best >= 0) { keep[best] = true; stack.push([i, best], [best, j]); }
      }
      return pts.filter((_, k) => keep[k]);
    }
    function encodeLage(editable) {
      const c = map.getCenter();
      const data = {
        v: 1, e: editable ? 1 : 0, c: [toInt(c.lat), toInt(c.lng), map.getZoom()],
        s: drawing.symbols.map((x) => [x.typeId, toInt(x.coordinate.latitude), toInt(x.coordinate.longitude), Math.round(x.rotation || 0), x.scale || 1, x.z || 17]),
        l: drawing.lines.map((x) => {
          const flat = [];
          let pa = 0, po = 0;
          let pts = x.points.map((p) => [toInt(p.latitude), toInt(p.longitude)]);
          if (findLine(x.typeId).freehand) pts = simplify(pts, 2);
          pts.forEach(([a, o]) => {
            flat.push(a - pa, o - po);
            pa = a; po = o;
          });
          return [x.typeId, flat, x.scale || 1, x.color || 0];
        }),
      };
      if (drawing.pin) data.p = [toInt(drawing.pin.latitude), toInt(drawing.pin.longitude), drawing.pin.label || ''];
      const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      return location.origin + location.pathname + '#lage=' + b64;
    }
    function decodeLage(b64) {
      const data = JSON.parse(decodeURIComponent(escape(atob(b64.replace(/-/g, '+').replace(/_/g, '/')))));
      if (!data || data.v !== 1 || !Array.isArray(data.s) || !Array.isArray(data.l)) throw new Error('lage');
      const symbols = data.s.filter((x) => ITEM_TYPES.some((t) => t.id === x[0])).map((x) => {
        const it = { id: newId(), typeId: x[0], coordinate: { latitude: x[1] / 1e5, longitude: x[2] / 1e5 }, z: x[5] };
        if (x[3]) it.rotation = x[3];
        if (x[4] !== 1) it.scale = x[4];
        return it;
      });
      const lines = data.l.filter((x) => LINE_TYPES.some((t) => t.id === x[0])).map((x) => {
        const points = [];
        let a = 0, o = 0;
        for (let i = 0; i + 1 < x[1].length; i += 2) {
          a += x[1][i]; o += x[1][i + 1];
          points.push({ latitude: a / 1e5, longitude: o / 1e5 });
        }
        const ln = { id: newId(), typeId: x[0], points };
        if (x[2] !== 1) ln.scale = x[2];
        if (x[3]) ln.color = x[3];
        return ln;
      });
      const d = { symbols, lines };
      if (Array.isArray(data.p) && typeof data.p[0] === 'number' && typeof data.p[1] === 'number') {
        d.pin = { latitude: data.p[0] / 1e5, longitude: data.p[1] / 1e5, label: String(data.p[2] || '').slice(0, 120) };
      }
      return { editable: data.e === 1, center: [data.c[0] / 1e5, data.c[1] / 1e5], zoom: data.c[2], drawing: d };
    }

    // ---------- Optionen ----------
