    // Adresse oder Ort suchen (kostenlose Suche von swisstopo) und dort die rote Nadel setzen
    const SEARCH_URL = 'https://api3.geo.admin.ch/rest/services/api/SearchServer?type=locations&sr=4326&limit=8&searchText=';
    const plainLabel = (html) => {
      const d = document.createElement('div');
      // «Bahnhofstrasse 5 <b>8001 Zürich</b>» → «Bahnhofstrasse 5, 8001 Zürich»
      d.innerHTML = String(html).replace(/([^>\s])\s+<b>/, '$1, <b>');
      return d.textContent.replace(/\s+/g, ' ').trim();
    };
    function searchAddress() {
      dialog('🔍 Adresse suchen', '', [], true);
      const extra = document.getElementById('dialogExtra');
      const input = document.createElement('input');
      input.className = 'searchInput';
      input.type = 'search';
      input.placeholder = 'Strasse Nr., Ort';
      input.setAttribute('enterkeyhint', 'search');
      input.autocomplete = 'off';
      const list = document.createElement('div');
      list.className = 'results';
      extra.appendChild(input);
      extra.appendChild(list);
      let timer = null, ask = 0;
      const msg = (t) => { list.innerHTML = '<div class="msg">' + esc(t) + '</div>'; };
      const run = () => {
        const q = input.value.trim();
        if (q.length < 2) { list.innerHTML = ''; return; }
        const my = ++ask;
        fetch(SEARCH_URL + encodeURIComponent(q))
          .then((r) => r.json())
          .then((data) => {
            if (my !== ask) return;
            const res = (data.results || []).filter((r) => r.attrs && typeof r.attrs.lat === 'number' && typeof r.attrs.lon === 'number');
            if (!res.length) { msg('Nichts gefunden.'); return; }
            list.innerHTML = '';
            res.forEach((r) => {
              const text = plainLabel(r.attrs.label);
              const b = document.createElement('button');
              b.textContent = '📍 ' + text;
              b.onclick = () => placePin(r.attrs.lat, r.attrs.lon, text, r.attrs.origin);
              list.appendChild(b);
            });
          })
          .catch(() => { if (my === ask) msg('Suche geht gerade nicht. Ist das Internet verbunden?'); });
      };
      input.oninput = () => { clearTimeout(timer); timer = setTimeout(run, 300); };
      input.onkeydown = (e) => { if (e.key === 'Enter') { clearTimeout(timer); run(); input.blur(); } };
      input.focus();
    }
    function placePin(lat, lng, label, origin) {
      document.getElementById('dialog').classList.remove('open');
      firstFix = false; // nicht mehr zum eigenen Standort springen
      drawing.pin = { latitude: lat, longitude: lng, label };
      save();
      renderDrawing();
      // Adresse ganz nah, Ort oder Gemeinde etwas weiter weg
      map.setView([lat, lng], origin === 'address' || origin === 'parcel' ? 18 : 15);
    }

    // Teilen-Knopf: zuerst Bild oder Lage
    function shareMenu() {
      dialog('Teilen', 'Was möchtest du teilen?', [
        { label: '📷 Bild', onClick: shareSnapshot },
        { label: '🔗 Lage teilen', primary: true, onClick: shareLage },
      ], true);
    }
    function shareLage() {
      if (!drawing.symbols.length && !drawing.lines.length && !drawing.pin) {
        dialog('Noch nichts eingezeichnet', 'Zeichne zuerst etwas ein, dann kannst du die Lage teilen.', [{ label: 'OK', primary: true }]);
        return;
      }
      dialog('Lage teilen', '👁 Nur ansehen: Der Empfänger sieht die Lagekarte, kann aber nichts verändern.\n\n✏️ Bearbeiten: Der Empfänger kann die Lagekarte nur für sich verändern. Du siehst seine Änderungen nicht.', [
        { label: '👁 Nur ansehen', onClick: () => howToSend(false) },
        { label: '✏️ Bearbeiten', primary: true, onClick: () => howToSend(true) },
      ], true);
    }
    // Link verschicken oder als QR-Code zeigen (zum Abscannen mit einem anderen Handy)
    function howToSend(editable) {
      dialog(editable ? 'Lage zum Bearbeiten' : 'Lage zum Ansehen', 'Wie möchtest du die Lage weitergeben?', [
        { label: '🔗 Link senden', onClick: () => sendLage(editable) },
        { label: '▦ QR-Code zeigen', primary: true, onClick: () => showQr(editable) },
      ], true);
    }
    function showQr(editable) {
      const url = encodeLage(editable);
      let qr;
      try {
        // längere Links ergeben so feine Codes, dass Handy-Kameras sie kaum noch lesen (getestet: bis ~1100 Zeichen gut)
        if (url.length > 1500) throw new Error('zu gross');
        qr = qrcode(0, 'L');
        qr.addData(url, 'Byte');
        qr.make();
      } catch (e) {
        dialog('Zu gross für einen QR-Code', 'In dieser Lage ist so viel eingezeichnet, dass sie nicht in einen QR-Code passt. Schicke stattdessen den Link.', [
          { label: '🔗 Link senden', primary: true, onClick: () => sendLage(editable) },
        ], true);
        return;
      }
      // scharfe Pixel: jedes Kästchen gleich viele Bildpunkte, mit weissem Rand rundherum
      const n = qr.getModuleCount(), quiet = 4, cell = Math.max(4, Math.floor(1200 / (n + 2 * quiet)));
      const size = (n + 2 * quiet) * cell;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = '#000';
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
      const img = document.getElementById('shareImg');
      img.src = canvas.toDataURL('image/png');
      img.classList.add('qr');
      document.getElementById('shareNote').textContent = (editable ? '✏️ Bearbeiten' : '👁 Nur ansehen') + ': Mit der Handy-Kamera scannen.'
        + (url.length > 700 ? ' Der Code ist sehr fein: Kamera nah und ruhig halten. Klappt es nicht, schicke den Link.' : '');
      const btns = document.getElementById('shareButtons');
      btns.innerHTML = '';
      btns.appendChild(button('Schliessen', '', closeShare));
      btns.appendChild(button('🔗 Link senden', 'primary', () => sendLage(editable)));
      document.getElementById('shareView').classList.add('open');
    }
    function sendLage(editable) {
      const url = encodeLage(editable);
      const text = editable ? 'Einsatzkarte: Lage zum Bearbeiten' : 'Einsatzkarte: Lage zum Ansehen';
      if (navigator.share) {
        navigator.share({ title: 'Einsatzkarte', text, url }).catch(() => {});
        return;
      }
      const done = () => dialog('Link kopiert', 'Der Link ist kopiert. Füge ihn in WhatsApp, Mail oder SMS ein.', [{ label: 'OK', primary: true }]);
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => window.prompt('Link kopieren:', url));
      else window.prompt('Link kopieren:', url);
    }

    // Beim Öffnen: steckt eine geteilte Lage im Link?
    function openLageLink() {
      const m = location.hash.match(/^#lage=([A-Za-z0-9_-]+)$/);
      if (!m) return;
      history.replaceState(null, '', location.pathname + location.search);
      let lage;
      try { lage = decodeLage(m[1]); } catch (e) {
        dialog('Link geht nicht', 'Diese geteilte Lage konnte nicht geöffnet werden. Vielleicht wurde der Link abgeschnitten.', [{ label: 'OK', primary: true }]);
        return;
      }
      firstFix = false; // nicht gleich zum eigenen Standort springen
      map.setView(lage.center, lage.zoom, { animate: false });
      const take = () => {
        drawing = lage.drawing;
        save();
        renderDrawing();
        dialog('Lage übernommen', 'Du kannst diese Lagekarte jetzt verändern. Die Änderungen gelten nur für dich; der Absender sieht sie nicht. Wenn andere sie sehen sollen, teile die Lage wieder.', [{ label: 'OK', primary: true }]);
      };
      if (!lage.editable) {
        viewOnly = true;
        drawing = lage.drawing;
      } else if (drawing.symbols.length || drawing.lines.length) {
        dialog('Geteilte Lage übernehmen?', 'Du kannst diese Lagekarte nur für dich verändern. Deine eigene Zeichnung auf diesem Gerät wird dabei ersetzt.', [
          { label: 'Abbrechen' },
          { label: 'Übernehmen', primary: true, onClick: take },
        ]);
      } else {
        take();
      }
    }
    function leaveViewOnly() {
      viewOnly = false;
      drawing = load();
      setMode({ kind: 'ansehen' });
    }

    // Beim Teilen wählen: so wie jetzt auf dem Bildschirm, oder so, dass alle Einträge drauf sind
    function shareSnapshot() {
      const pts = drawing.symbols.map((s) => s.coordinate)
        .concat(...drawing.lines.map((l) => l.points))
        .concat(drawing.pin ? [drawing.pin] : [])
        .map((c) => [c.latitude, c.longitude]);
      if (pts.length === 0) { shareNow(); return; }
      dialog('Was soll aufs Bild?', 'Wähle den Ausschnitt für das Bild.', [
        { label: 'Aktueller Ausschnitt', onClick: shareNow },
        { label: 'Alles zeigen', primary: true, onClick: () => shareAll(pts) },
      ], true);
    }

    function shareAll(pts) {
      // Karte so hinschieben, dass alle Einträge sichtbar sind, und warten bis die Kacheln geladen sind
      let done = false;
      const layer = tileLayer;
      const go = () => { if (done) return; done = true; if (layer) layer.off('load', go); shareNow(); };
      if (layer) layer.on('load', go);
      const b = L.latLngBounds(pts);
      if (pts.length === 1 || b.getNorthEast().equals(b.getSouthWest())) map.setView(b.getCenter(), Math.max(map.getZoom(), 17), { animate: false });
      else map.fitBounds(b, { padding: [60, 60], maxZoom: 18, animate: false });
      if (vectorOn()) { syncGl(); gl.once('idle', go); }
      else setTimeout(() => { if (layer && !layer.isLoading()) go(); }, 150);
      setTimeout(go, 4000);
    }

    function shareNow() {
      let snap, dataUrl;
      try {
        snap = snapshotCanvas();
        dataUrl = snap.canvas.toDataURL('image/png');
      } catch (e) {
        dialog('Bild geht gerade nicht', 'Das Bild konnte nicht erstellt werden. Mach stattdessen ein Bildschirmfoto: Seitentaste und Lauter-Taste gleichzeitig drücken.', [{ label: 'OK', primary: true }]);
        return;
      }
      const c = snap.center;
      const text = 'Einsatzkarte ' + snap.stamp + '\nKartenmitte: https://maps.apple.com/?ll=' + c.lat.toFixed(6) + ',' + c.lng.toFixed(6) + '&q=Einsatzort';

      // Datei schon jetzt vorbereiten, damit «Teilen» direkt beim Tippen öffnet
      let file = null;
      try {
        const bin = atob(dataUrl.split(',')[1]);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        file = new File([bytes], 'Einsatzkarte-' + snap.stamp.replace(/[ .:]/g, '-') + '.png', { type: 'image/png' });
      } catch (e) {}
      const canShareFile = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));

      document.getElementById('shareImg').src = dataUrl;
      document.getElementById('shareNote').textContent = canShareFile
        ? 'So wird der Ausschnitt verschickt.'
        : 'Halte das Bild gedrückt und wähle «In Fotos sichern» oder «Teilen».';
      const btns = document.getElementById('shareButtons');
      btns.innerHTML = '';
      btns.appendChild(button('Schliessen', '', closeShare));
      if (canShareFile) {
        btns.appendChild(button('📤 Teilen', 'primary', () => {
          navigator.share({ files: [file], text }).catch(() => {});
        }));
      }
      document.getElementById('shareView').classList.add('open');
    }

    // ---------- Dialog ----------
    // cancel: zusätzlich «Abbrechen» unten; auch ein Tipp neben das Fenster schliesst es
    function dialog(title, text, buttons, cancel) {
      document.getElementById('dialogTitle').textContent = title;
      document.getElementById('dialogText').textContent = text;
      const box = document.getElementById('dialogButtons');
      box.innerHTML = '';
      box.classList.remove('stack');
      const extra = document.getElementById('dialogExtra');
      extra.innerHTML = '';
      const dlgBox = document.getElementById('dialogBox');
      dlgBox.insertBefore(extra, box);
      dlgBox.querySelectorAll(':scope > .cancel').forEach((c) => c.remove());
      const el = document.getElementById('dialog');
      buttons.forEach((b) => {
        box.appendChild(button(b.label, b.danger ? 'danger' : b.primary ? 'primary' : '', () => {
          el.classList.remove('open');
          if (b.onClick) b.onClick();
        }));
      });
      if (cancel) box.appendChild(button('Abbrechen', 'cancel', () => el.classList.remove('open')));
      el.onclick = (e) => { if (cancel && e.target === el) el.classList.remove('open'); };
      el.classList.add('open');
    }

    // iPhone-Safari ignoriert user-scalable=no: Zoom-Gesten ausserhalb der Karte selbst abfangen
    ['gesturestart', 'gesturechange'].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1 && !e.target.closest('#map')) e.preventDefault();
    }, { passive: false });

    // ---------- Start ----------
    setBase((() => { try { const k = localStorage.getItem(BASE_KEY); return BASE_MAPS[k] ? k : 'luftbild'; } catch (e) { return 'luftbild'; } })());
    openLageLink();
    renderDrawing();
    renderUI();
    window.addEventListener('resize', renderUI);
    startWatching();
  })();
  </script>
</body>
