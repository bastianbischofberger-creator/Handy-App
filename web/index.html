<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Einsatzkarte</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Einsatzkarte" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { position: absolute; inset: 0; }
    .leaflet-container { background: #e8e8e8; }

    #top { position: absolute; z-index: 1000; left: 12px; right: 12px;
      top: calc(env(safe-area-inset-top) + 8px); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    #topRow { display: flex; justify-content: space-between; align-items: flex-start; }
    .segment { display: flex; background: #fff; border-radius: 10px; padding: 3px; pointer-events: auto;
      box-shadow: 0 1px 6px rgba(0,0,0,.25); }
    .segment button { border: 0; background: none; padding: 7px 14px; border-radius: 8px;
      font-weight: 600; font-size: 15px; color: #333; }
    .segment button.active { background: #D32F2F; color: #fff; }
    #logo { width: 46px; height: 48px; object-fit: contain; }
    #hint { background: rgba(0,0,0,.7); color: #fff; border-radius: 10px; padding: 8px 12px; font-size: 14px; }

    #locate { position: absolute; z-index: 1000; right: 14px; width: 50px; height: 50px; border-radius: 25px;
      border: 0; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.3); font-size: 28px; color: #1565C0; line-height: 50px; padding: 0; }
    #attribution { position: absolute; z-index: 1000; left: 8px; font-size: 11px; color: #333;
      background: rgba(255,255,255,.7); padding: 0 4px; border-radius: 3px; }

    #panel { position: absolute; z-index: 1000; left: 0; right: 0; bottom: 0; background: #fff;
      border-radius: 18px 18px 0 0; padding: 12px 12px calc(env(safe-area-inset-bottom) + 10px);
      box-shadow: 0 -2px 10px rgba(0,0,0,.2); display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 8px; }
    .btn { flex: 1; border: 0; padding: 14px 6px; border-radius: 12px; background: #eee;
      font-size: 15px; font-weight: 600; color: #222; line-height: 1.2; }
    .btn:active { opacity: .7; }
    .btn.primary { background: #1565C0; color: #fff; }
    .btn.danger { background: #C62828; color: #fff; }

    .palette { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
    .palItem { flex: 0 0 84px; display: flex; flex-direction: column; align-items: center; padding: 8px 2px;
      border-radius: 12px; border: 2px solid transparent; background: #f4f4f4; }
    .palItem.active { border-color: #1565C0; background: #E3F2FD; }
    .palItem span { font-size: 11px; text-align: center; margin-top: 4px; color: #222; line-height: 1.2; }

    .lineChoice { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 4px;
      border-radius: 12px; border: 2px solid #ddd; background: #fafafa; min-width: 0; }
    .lineChoice span { font-size: 13px; font-weight: 600; color: #222; margin-top: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .lineChoice.disabled { opacity: .35; }
    .sample { display: flex; align-items: center; min-height: 14px; gap: 4px; }

    .fksIcon { display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 6px;
      box-shadow: 0 1px 3px rgba(0,0,0,.45); }
    .rLabel { width: 18px; height: 20px; display: flex; align-items: center; justify-content: center; background: #fff;
      color: #2F6DB5; font-weight: 800; font-size: 15px; border-radius: 3px; }
    .palItem { position: relative; }
    .palItem .nr { position: absolute; top: 4px; left: 6px; width: 18px; height: 18px; border-radius: 9px; background: #D32F2F;
      color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
    .badge { display: flex; align-items: center; justify-content: center; border-radius: 50%;
      border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); color: #fff; font-weight: 800; }
    .symbolIcon { background: none; border: 0; }
    .draftDot { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid; }
    .meDot { width: 18px; height: 18px; border-radius: 50%; background: #1E88E5; border: 3px solid #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,.2), 0 1px 4px rgba(0,0,0,.4); }

    #shareView { position: fixed; inset: 0; z-index: 1900; background: rgba(0,0,0,.85); display: none;
      flex-direction: column; padding: calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px); gap: 12px; }
    #shareView.open { display: flex; }
    #shareImg { flex: 1; min-height: 0; width: 100%; object-fit: contain; -webkit-touch-callout: default; }
    #shareNote { color: #fff; font-size: 14px; text-align: center; }
    #dialog { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.35); display: none;
      align-items: center; justify-content: center; padding: 24px; }
    #dialog.open { display: flex; }
    #dialogBox { background: #fff; border-radius: 14px; padding: 18px; width: 100%; max-width: 340px; }
    #dialogTitle { font-weight: 700; font-size: 17px; margin-bottom: 6px; }
    #dialogText { font-size: 15px; color: #333; margin-bottom: 14px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="top">
    <div id="topRow">
      <div class="segment" id="baseSwitch"></div>
      <img id="logo" src="logo.png" alt="Logo" />
    </div>
    <div id="hint"></div>
  </div>

  <button id="locate" aria-label="Zu meinem Standort">◎</button>
  <div id="attribution">© swisstopo</div>
  <div id="panel"></div>

  <div id="shareView">
    <img id="shareImg" alt="Kartenausschnitt" />
    <div id="shareNote"></div>
    <div class="row" id="shareButtons"></div>
  </div>

  <div id="dialog">
    <div id="dialogBox">
      <div id="dialogTitle"></div>
      <div id="dialogText"></div>
      <div class="row" id="dialogButtons"></div>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script>
  (function () {
    // ---------- Einstellungen ----------
    const BASE_MAPS = {
      karte: { label: 'Karte', url: 'https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg' },
      luftbild: { label: 'Luftbild', url: 'https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg' },
    };
    // Die 6 Absprachepunkte nach FKS (Feuerwehr Koordination Schweiz)
    const FKS_BLUE = '#2F6DB5';
    const FKS_RECT = '<rect x="6" y="6" width="28" height="28"/>';
    const SYMBOL_TYPES = [
      { id: 'patientensammelstelle', nr: 1, name: 'Patientensammelstelle', svg: FKS_RECT + '<path d="M20 6V34M6 20H34"/>' },
      { id: 'sanhist', nr: 2, name: 'San Hist', svg: FKS_RECT + '<path d="M20 6V34M6 18H34M6 22.5H34"/>' },
      { id: 'rettungsachse', nr: 3, name: 'Rettungsachse', zone: 'rettungsachse',
        svg: '<path d="M20 2V9M20 24V29"/><text x="20" y="21" text-anchor="middle" font-size="13" font-weight="800" font-family="Arial, Helvetica, sans-serif" fill="' + FKS_BLUE + '" stroke="none">R</text><path d="M14 29H26L20 38Z" fill="' + FKS_BLUE + '" stroke="none"/>' },
      { id: 'einsatzleitung', nr: 4, name: 'Einsatzleitung', svg: '<path d="M15 3V25M13.3 4.7H31M15 13H29"/><circle cx="15" cy="31" r="6"/>' },
      { id: 'sammelstelle', nr: 5, name: 'Sammelstelle Unverletzte', svg: FKS_RECT + '<path d="M6 18H34M6 22.5H34"/>' },
      { id: 'warteraum', nr: 6, name: 'Warteraum', svg: FKS_RECT + '<text x="20" y="28" text-anchor="middle" font-size="21" font-weight="800" font-family="Arial, Helvetica, sans-serif" fill="' + FKS_BLUE + '" stroke="none">W</text>' },
    ];
    const PLACEABLE = SYMBOL_TYPES.filter((t) => !t.zone);
    // Zonen wie im FKS-Schema: Gefahrenzone rot, Sperrzone gelb (beide mit rot-weisser Absperrung),
    // Verkehrsumleitzone nur als Umriss. «order» bestimmt, was oben liegt.
    const LINE_TYPES = [
      { id: 'rettungsachse', name: 'Rettungsachse', color: FKS_BLUE, width: 4, closed: false, dashed: true, axis: true, order: 3 },
      { id: 'gefahrenzone', name: 'Gefahrenzone', color: '#D32F2F', width: 4, closed: true, dashed: true, barrier: true, fill: '#E8603C', fillOpacity: 0.6, order: 2 },
      { id: 'sperrzone', name: 'Sperrzone', color: '#D32F2F', width: 4, closed: true, dashed: true, barrier: true, fill: '#FFE45C', fillOpacity: 0.45, order: 1 },
      { id: 'verkehrsumleitung', name: 'Verkehrsumleitzone', color: '#F57C00', width: 4, closed: true, dashed: true, order: 0 },
    ];
    const STORAGE_KEY = 'einsatzkarte.zeichnung.v1';

    const findSymbol = (id) => PLACEABLE.find((s) => s.id === id) || PLACEABLE[0];
    const findLine = (id) => LINE_TYPES.find((l) => l.id === id) || LINE_TYPES[0];
    const newId = () => Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    // ---------- Zustand ----------
    let drawing = load();
    let mode = { kind: 'ansehen' };
    let baseKey = 'karte';

    function load() {
      try {
        const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (d && Array.isArray(d.symbols) && Array.isArray(d.lines)) {
          // Symbole aus früheren Versionen, die es nicht mehr gibt, weglassen
          d.symbols = d.symbols.filter((x) => PLACEABLE.some((t) => t.id === x.typeId));
          return d;
        }
      } catch (e) {}
      return { symbols: [], lines: [] };
    }
    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(drawing)); } catch (e) {}
    }

    // ---------- Karte ----------
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false,
      maxZoom: 20,
      minZoom: 7,
      maxBounds: [[45.4, 5.4], [48.2, 11.0]],
      maxBoundsViscosity: 0.8,
    }).setView([46.8, 8.23], 8);

    let tileLayer = null;
    // Kacheln mit CORS laden, damit sie ins geteilte Bild dürfen. Klappt das nicht, ohne CORS weiter.
    let useCors = true;
    function setBase(key) {
      baseKey = key;
      if (tileLayer) map.removeLayer(tileLayer);
      let loadedAny = false;
      const opts = { maxNativeZoom: 18, maxZoom: 20 };
      if (useCors) opts.crossOrigin = 'anonymous';
      tileLayer = L.tileLayer(BASE_MAPS[key].url, opts).addTo(map);
      tileLayer.on('tileload', () => { loadedAny = true; });
      tileLayer.on('tileerror', () => {
        if (useCors && !loadedAny) { useCors = false; setBase(baseKey); }
      });
      renderBaseSwitch();
    }

    const drawLayer = L.layerGroup().addTo(map);
    const draftLayer = L.layerGroup().addTo(map);

    // ---------- Standort ----------
    let meMarker = null, meCircle = null, firstFix = true;
    const meIcon = L.divIcon({ className: 'symbolIcon', html: '<div class="meDot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });

    function showMe(pos) {
      const ll = [pos.coords.latitude, pos.coords.longitude];
      if (!meMarker) {
        meCircle = L.circle(ll, { radius: pos.coords.accuracy, color: '#1E88E5', weight: 1, fillOpacity: 0.12, interactive: false }).addTo(map);
        meMarker = L.marker(ll, { icon: meIcon, interactive: false, keyboard: false, zIndexOffset: 1000 }).addTo(map);
      } else {
        meMarker.setLatLng(ll);
        meCircle.setLatLng(ll).setRadius(pos.coords.accuracy);
      }
      return ll;
    }

    function startWatching() {
      if (!navigator.geolocation) return;
      navigator.geolocation.watchPosition(
        (pos) => {
          const ll = showMe(pos);
          if (firstFix) { firstFix = false; map.flyTo(ll, 17, { duration: 0.8 }); }
        },
        (err) => {
          if (err.code === 1) {
            dialog('Kein Standort', 'Bitte erlaube den Zugriff auf deinen Standort. Auf dem iPhone: Einstellungen › Datenschutz › Ortungsdienste › Safari-Websites › «Beim Verwenden».', [{ label: 'OK', primary: true }]);
          }
        },
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 },
      );
    }

    document.getElementById('locate').onclick = () => {
      if (meMarker) map.flyTo(meMarker.getLatLng(), Math.max(map.getZoom(), 17), { duration: 0.8 });
      else { firstFix = true; startWatching(); }
    };

    // ---------- Zeichnen ----------
    function svgDoc(t, size) {
      return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 40 40" fill="none" stroke="' + FKS_BLUE + '" stroke-width="4">' + t.svg + '</svg>';
    }
    function symbolHtml(t, size) {
      return '<div class="fksIcon" style="width:' + size + 'px;height:' + size + 'px">' + svgDoc(t, size - 4) + '</div>';
    }
    // Symbole auch als Bild bereithalten, für «Ausschnitt teilen»
    const symbolImg = {};
    PLACEABLE.forEach((t) => {
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgDoc(t, 64));
      symbolImg[t.id] = img;
    });

    // Rettungsachse: Positionen für die «R» entlang der Linie und den Pfeil am Ende (in Bildschirmpunkten)
    function axisMarks(pts) {
      const marks = [];
      const step = 90;
      let next = 45, walked = 0;
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i];
        const len = Math.hypot(b.x - a.x, b.y - a.y);
        while (next <= walked + len - 20) {
          const f = (next - walked) / len;
          marks.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f });
          next += step;
        }
        walked += len;
      }
      const a = pts[pts.length - 2], b = pts[pts.length - 1];
      return { marks, arrow: { x: b.x, y: b.y, angle: Math.atan2(b.y - a.y, b.x - a.x) } };
    }
    const arrowSvg = (color) => '<svg width="22" height="22" viewBox="0 0 22 22"><path d="M2 3L20 11L2 19Z" fill="' + color + '"/></svg>';

    function addAxisDecor(layer, latlngs, t) {
      if (latlngs.length < 2) return;
      const pts = latlngs.map((ll) => map.latLngToContainerPoint(ll));
      const { marks, arrow } = axisMarks(pts);
      marks.forEach((m) => {
        L.marker(map.containerPointToLatLng([m.x, m.y]), {
          icon: L.divIcon({ className: 'symbolIcon', html: '<div class="rLabel">R</div>', iconSize: [18, 20], iconAnchor: [9, 10] }),
          interactive: false, keyboard: false,
        }).addTo(layer);
      });
      L.marker(map.containerPointToLatLng([arrow.x, arrow.y]), {
        icon: L.divIcon({ className: 'symbolIcon', html: '<div style="transform:rotate(' + arrow.angle + 'rad)">' + arrowSvg(t.color) + '</div>', iconSize: [22, 22], iconAnchor: [11, 11] }),
        interactive: false, keyboard: false,
      }).addTo(layer);
    }

    function lineStyle(t) {
      return { color: t.color, weight: t.width, dashArray: t.dashed ? (t.axis ? '14 10' : '12 8') : null,
        lineCap: t.barrier ? 'butt' : 'round', lineJoin: 'round',
        fill: !!t.fill, fillColor: t.fill || t.color, fillOpacity: t.fill ? t.fillOpacity : 0 };
    }

    // points: [[lat, lng], ...]; holes: weitere Ringe, die aus der Fläche ausgespart werden
    function shapeFor(t, points, opts, holes) {
      const style = Object.assign(lineStyle(t), opts || {});
      if (!(t.closed && points.length >= 3)) return L.polyline(points, style);
      return L.polygon(holes && holes.length ? [points].concat(holes) : points, style);
    }

    // Weisse Linie unter der roten Strichlinie: ergibt die rot-weisse Absperrung
    function barrierUnderlay(t, points) {
      const o = { color: '#fff', weight: t.width + 2, fill: false, interactive: false, lineJoin: 'round' };
      return t.closed && points.length >= 3 ? L.polygon(points, o) : L.polyline(points, o);
    }

    function insideRing(pt, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][1], yi = ring[i][0], xj = ring[j][1], yj = ring[j][0];
        if ((yi > pt[0]) !== (yj > pt[0]) && pt[1] < ((xj - xi) * (pt[0] - yi)) / (yj - yi) + xi) inside = !inside;
      }
      return inside;
    }
    const linePts = (line) => line.points.map((p) => [p.latitude, p.longitude]);

    // Zonen von unten nach oben; die Sperrzone spart Gefahrenzonen aus, die ganz in ihr liegen,
    // damit deren Rot nicht vom Gelb überdeckt wird.
    function layeredLines() {
      const gefahr = drawing.lines.filter((l) => l.typeId === 'gefahrenzone' && l.points.length >= 3).map(linePts);
      return drawing.lines
        .slice()
        .sort((a, b) => findLine(a.typeId).order - findLine(b.typeId).order)
        .map((line) => {
          const pts = linePts(line);
          const holes = line.typeId === 'sperrzone' && pts.length >= 3 ? gefahr.filter((g) => g.every((q) => insideRing(q, pts))) : [];
          return { line, t: findLine(line.typeId), pts, holes };
        });
    }

    function renderDrawing() {
      drawLayer.clearLayers();
      layeredLines().forEach(({ line, t, pts, holes }) => {
        if (t.barrier) barrierUnderlay(t, pts).addTo(drawLayer);
        const shape = shapeFor(t, pts, { bubblingMouseEvents: false }, holes);
        shape.on('click', (e) => {
          if (mode.kind === 'ansehen') {
            dialog(t.name, 'Möchtest du diese Zone löschen?', [
              { label: 'Abbrechen' },
              { label: 'Löschen', danger: true, onClick: () => { drawing.lines = drawing.lines.filter((l) => l.id !== line.id); save(); renderDrawing(); } },
            ]);
          } else {
            onMapClick(e);
          }
        });
        shape.addTo(drawLayer);
        if (t.axis) addAxisDecor(drawLayer, line.points.map((p) => L.latLng(p.latitude, p.longitude)), t);
      });
      drawing.symbols.forEach((s) => {
        const t = findSymbol(s.typeId);
        const icon = L.divIcon({ className: 'symbolIcon', html: symbolHtml(t, 46), iconSize: [46, 46], iconAnchor: [23, 23] });
        const m = L.marker([s.coordinate.latitude, s.coordinate.longitude], { icon, draggable: true, autoPan: true });
        m.on('dragend', () => {
          const ll = m.getLatLng();
          s.coordinate = { latitude: ll.lat, longitude: ll.lng };
          save();
        });
        m.on('click', () => {
          if (mode.kind !== 'ansehen') return;
          dialog(t.name, 'Möchtest du diesen Absprachepunkt löschen? Zum Verschieben gedrückt halten und ziehen.', [
            { label: 'Abbrechen' },
            { label: 'Löschen', danger: true, onClick: () => { drawing.symbols = drawing.symbols.filter((x) => x.id !== s.id); save(); renderDrawing(); } },
          ]);
        });
        m.addTo(drawLayer);
      });
    }

    function renderDraft() {
      draftLayer.clearLayers();
      if (mode.kind !== 'linie' || !mode.typeId || mode.points.length === 0) return;
      const t = findLine(mode.typeId);
      if (t.barrier) barrierUnderlay(t, mode.points).addTo(draftLayer);
      shapeFor(t, mode.points, { interactive: false }).addTo(draftLayer);
      if (t.axis) addAxisDecor(draftLayer, mode.points.map((p) => L.latLng(p[0], p[1])), t);
      mode.points.forEach((p) => {
        L.marker(p, {
          icon: L.divIcon({ className: 'symbolIcon', html: '<div class="draftDot" style="border-color:' + t.color + '"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }),
          interactive: false,
        }).addTo(draftLayer);
      });
    }

    function onMapClick(e) {
      const ll = e.latlng;
      if (mode.kind === 'symbol' && mode.typeId) {
        drawing.symbols.push({ id: newId(), typeId: mode.typeId, coordinate: { latitude: ll.lat, longitude: ll.lng } });
        save();
        renderDrawing();
      } else if (mode.kind === 'linie' && mode.typeId) {
        mode.points.push([ll.lat, ll.lng]);
        renderDraft();
        renderUI();
      }
    }
    map.on('click', onMapClick);
    // «R» und Pfeil der Rettungsachse nach dem Zoomen neu verteilen
    map.on('zoomend', () => { renderDrawing(); renderDraft(); });

    function finishLine() {
      const t = findLine(mode.typeId);
      const needed = t.closed ? 3 : 2;
      if (mode.points.length < needed) {
        dialog('Zu wenig Punkte', 'Für eine ' + t.name + ' braucht es mindestens ' + needed + ' Punkte.', [{ label: 'OK', primary: true }]);
        return;
      }
      drawing.lines.push({ id: newId(), typeId: t.id, points: mode.points.map((p) => ({ latitude: p[0], longitude: p[1] })) });
      save();
      setMode({ kind: 'linie', typeId: null, points: [] });
      renderDrawing();
    }

    // ---------- Oberfläche ----------
    function setMode(m) {
      mode = m;
      renderDraft();
      renderUI();
    }

    function renderBaseSwitch() {
      const el = document.getElementById('baseSwitch');
      el.innerHTML = '';
      Object.keys(BASE_MAPS).forEach((key) => {
        const b = document.createElement('button');
        b.textContent = BASE_MAPS[key].label;
        if (key === baseKey) b.className = 'active';
        b.onclick = () => setBase(key);
        el.appendChild(b);
      });
    }

    function hintText() {
      if (mode.kind === 'symbol') {
        return mode.typeId ? 'Tippe auf die Karte, um «' + findSymbol(mode.typeId).name + '» zu setzen.' : 'Wähle unten einen Absprachepunkt aus.';
      }
      if (mode.kind === 'linie') {
        if (!mode.typeId) return 'Wähle unten die Art der Zone.';
        const t = findLine(mode.typeId);
        return mode.points.length === 0
          ? 'Tippe Punkt für Punkt auf die Karte, um die ' + t.name + ' zu zeichnen.' + (t.axis ? ' Der Pfeil zeigt zum letzten Punkt.' : '')
          : mode.points.length + ' Punkt(e) gesetzt. Weiter tippen oder «Zone fertig» drücken.';
      }
      return 'Tippe auf einen Absprachepunkt oder eine Zone, um ihn zu löschen. Absprachepunkte gedrückt halten und ziehen zum Verschieben.';
    }

    function button(label, cls, onClick) {
      const b = document.createElement('button');
      b.className = 'btn' + (cls ? ' ' + cls : '');
      b.textContent = label;
      b.onclick = onClick;
      return b;
    }
    function row(children) {
      const r = document.createElement('div');
      r.className = 'row';
      children.forEach((c) => r.appendChild(c));
      return r;
    }

    function renderUI() {
      document.getElementById('hint').textContent = hintText();
      const panel = document.getElementById('panel');
      panel.innerHTML = '';

      if (mode.kind === 'ansehen') {
        panel.appendChild(row([
          button('Absprachepunkt setzen', '', () => setMode({ kind: 'symbol', typeId: null })),
          button('Zone zeichnen', '', () => setMode({ kind: 'linie', typeId: null, points: [] })),
        ]));
        panel.appendChild(row([
          button('📤 Ausschnitt teilen', 'primary', shareSnapshot),
          button('Alles löschen', 'danger', () => {
            if (!drawing.symbols.length && !drawing.lines.length) return;
            dialog('Alles löschen?', 'Alle Absprachepunkte und Zonen werden entfernt.', [
              { label: 'Abbrechen' },
              { label: 'Alles löschen', danger: true, onClick: () => { drawing = { symbols: [], lines: [] }; save(); renderDrawing(); } },
            ]);
          }),
        ]));
      }

      if (mode.kind === 'symbol') {
        const pal = document.createElement('div');
        pal.className = 'palette';
        SYMBOL_TYPES.forEach((t) => {
          const item = document.createElement('div');
          item.className = 'palItem' + (mode.typeId === t.id ? ' active' : '');
          item.innerHTML = '<b class="nr">' + t.nr + '</b>' + symbolHtml(t, 42) + '<span>' + esc(t.name) + '</span>';
          // Nr. 3 ist keine Markierung, sondern eine Linie: direkt zum Zeichnen der Rettungsachse
          item.onclick = () => setMode(t.zone ? { kind: 'linie', typeId: t.zone, points: [] } : { kind: 'symbol', typeId: t.id });
          pal.appendChild(item);
        });
        panel.appendChild(pal);
        panel.appendChild(row([button('Fertig', 'primary', () => setMode({ kind: 'ansehen' }))]));
        const active = pal.querySelector('.active');
        if (active) active.scrollIntoView({ inline: 'nearest', block: 'nearest' });
      }

      if (mode.kind === 'linie') {
        const locked = mode.points.length > 0;
        const choice = (t) => {
          const c = document.createElement('div');
          const selected = mode.typeId === t.id;
          c.className = 'lineChoice' + (locked && !selected ? ' disabled' : '');
          if (selected) { c.style.borderColor = t.color; c.style.background = t.color + '22'; }
          const sample = t.fill
            ? '<div style="width:36px;height:14px;background:' + t.fill + Math.round(t.fillOpacity * 255).toString(16) + ';border:2px dashed ' + t.color + '"></div>'
            : t.axis
            ? '<div style="width:10px;height:4px;background:' + t.color + '"></div><b style="color:' + t.color + ';font-size:12px;line-height:8px">R</b><div style="width:10px;height:4px;background:' + t.color + '"></div><div style="width:0;height:0;border-left:8px solid ' + t.color + ';border-top:5px solid transparent;border-bottom:5px solid transparent"></div>'
            : t.dashed
            ? [0, 1, 2].map(() => '<div style="width:10px;height:4px;background:' + t.color + '"></div>').join('')
            : '<div style="width:38px;height:5px;border-radius:3px;background:' + t.color + '"></div>';
          c.innerHTML = '<div class="sample">' + sample + '</div><span>' + esc(t.name) + '</span>';
          c.onclick = () => { if (!locked) setMode({ kind: 'linie', typeId: t.id, points: [] }); };
          return c;
        };
        for (let k = 0; k < LINE_TYPES.length; k += 2) panel.appendChild(row(LINE_TYPES.slice(k, k + 2).map(choice)));
        panel.appendChild(row(locked
          ? [
              button('Punkt zurück', '', () => { mode.points.pop(); renderDraft(); renderUI(); }),
              button('Verwerfen', 'danger', () => { mode.points = []; renderDraft(); renderUI(); }),
              button('Zone fertig', 'primary', finishLine),
            ]
          : [button('Fertig', 'primary', () => setMode({ kind: 'ansehen' }))]));
      }

      // Standort-Knopf und Quellenangabe über dem Werkzeug-Bereich halten
      const h = panel.offsetHeight;
      document.getElementById('locate').style.bottom = (h + 14) + 'px';
      document.getElementById('attribution').style.bottom = (h + 6) + 'px';
    }

    // ---------- Ausschnitt als Bild teilen ----------
    function snapshotCanvas() {
      const container = map.getContainer();
      const box = container.getBoundingClientRect();
      const w = Math.round(box.width), h = Math.round(box.height);
      const scale = Math.min(window.devicePixelRatio || 1, 2);
      const footer = 44;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round((h + footer) * scale);
      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);
      ctx.fillStyle = '#e8e8e8';
      ctx.fillRect(0, 0, w, h);

      // Kartenkacheln so übernehmen, wie sie gerade auf dem Bildschirm liegen
      container.querySelectorAll('.leaflet-tile-pane img.leaflet-tile-loaded').forEach((img) => {
        const r = img.getBoundingClientRect();
        if (r.right < box.left || r.left > box.right || r.bottom < box.top || r.top > box.bottom) return;
        ctx.drawImage(img, r.left - box.left, r.top - box.top, r.width, r.height);
      });

      const pt = (lat, lng) => map.latLngToContainerPoint([lat, lng]);

      // Zonen (gleiche Reihenfolge und Aussparungen wie auf der Karte)
      layeredLines().forEach(({ t, pts: ll, holes }) => {
        const pts = ll.map((p) => pt(p[0], p[1]));
        if (pts.length < 2) return;
        const closed = t.closed && pts.length >= 3;
        const ring = (r) => { r.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); if (closed) ctx.closePath(); };
        if (closed && t.fill) {
          ctx.beginPath();
          ring(pts);
          holes.forEach((h) => ring(h.map((p) => pt(p[0], p[1]))));
          ctx.globalAlpha = t.fillOpacity;
          ctx.fillStyle = t.fill;
          ctx.fill('evenodd');
          ctx.globalAlpha = 1;
        }
        ctx.beginPath();
        ring(pts);
        ctx.lineJoin = 'round';
        if (t.barrier) {
          ctx.setLineDash([]);
          ctx.lineWidth = t.width + 2;
          ctx.strokeStyle = '#fff';
          ctx.stroke();
        }
        ctx.setLineDash(t.dashed ? (t.axis ? [14, 10] : [12, 8]) : []);
        ctx.lineWidth = t.width;
        ctx.lineCap = t.barrier ? 'butt' : 'round';
        ctx.strokeStyle = t.color;
        ctx.stroke();
        ctx.setLineDash([]);
        if (t.axis) {
          const { marks, arrow } = axisMarks(pts);
          ctx.font = '800 15px -apple-system, BlinkMacSystemFont, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          marks.forEach((m) => {
            ctx.fillStyle = '#fff';
            ctx.fillRect(m.x - 7, m.y - 9, 14, 18);
            ctx.fillStyle = t.color;
            ctx.fillText('R', m.x, m.y + 1);
          });
          ctx.save();
          ctx.translate(arrow.x, arrow.y);
          ctx.rotate(arrow.angle);
          ctx.beginPath();
          ctx.moveTo(9, 0); ctx.lineTo(-9, -8); ctx.lineTo(-9, 8); ctx.closePath();
          ctx.fillStyle = t.color;
          ctx.fill();
          ctx.restore();
        }
      });

      // Eigener Standort
      if (meMarker) {
        const p = map.latLngToContainerPoint(meMarker.getLatLng());
        ctx.beginPath();
        ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
        ctx.fillStyle = '#1E88E5';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#fff';
        ctx.stroke();
      }

      // Absprachepunkte
      drawing.symbols.forEach((s) => {
        const t = findSymbol(s.typeId);
        const p = pt(s.coordinate.latitude, s.coordinate.longitude);
        const size = 46;
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,.4)';
        ctx.shadowBlur = 3;
        ctx.shadowOffsetY = 1;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(p.x - size / 2, p.y - size / 2, size, size, 6);
        else ctx.rect(p.x - size / 2, p.y - size / 2, size, size);
        ctx.fill();
        ctx.restore();
        const img = symbolImg[t.id];
        if (img && img.complete) ctx.drawImage(img, p.x - size / 2 + 2, p.y - size / 2 + 2, size - 4, size - 4);
      });

      // Logo oben rechts
      const logo = document.getElementById('logo');
      if (logo.complete && logo.naturalWidth) ctx.drawImage(logo, w - 58, 10, 46, 48);

      // Fusszeile mit Datum, Kartenmitte und Quelle
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, h, w, footer);
      const c = map.getCenter();
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const stamp = pad(now.getDate()) + '.' + pad(now.getMonth() + 1) + '.' + now.getFullYear() + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
      ctx.fillStyle = '#222';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = '600 13px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillText('Einsatzkarte · ' + stamp, 10, h + 14);
      ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillStyle = '#555';
      ctx.fillText('Kartenmitte ' + c.lat.toFixed(5) + ', ' + c.lng.toFixed(5) + ' · © swisstopo', 10, h + 32);
      return { canvas, stamp, center: c };
    }

    function closeShare() {
      document.getElementById('shareView').classList.remove('open');
    }

    function shareSnapshot() {
      let snap, dataUrl;
      try {
        snap = snapshotCanvas();
        dataUrl = snap.canvas.toDataURL('image/png');
      } catch (e) {
        dialog('Bild geht gerade nicht', 'Das Bild konnte nicht erstellt werden. Mach stattdessen ein Bildschirmfoto: Seitentaste und Lauter-Taste gleichzeitig drücken.', [{ label: 'OK', primary: true }]);
        return;
      }
      const c = snap.center;
      const text = 'Einsatzkarte ' + snap.stamp + '\nKartenmitte: https://maps.apple.com/?ll=' + c.lat.toFixed(6) + ',' + c.lng.toFixed(6) + '&q=Einsatzort';

      // Datei schon jetzt vorbereiten, damit «Teilen» direkt beim Tippen öffnet
      let file = null;
      try {
        const bin = atob(dataUrl.split(',')[1]);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        file = new File([bytes], 'Einsatzkarte-' + snap.stamp.replace(/[ .:]/g, '-') + '.png', { type: 'image/png' });
      } catch (e) {}
      const canShareFile = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));

      document.getElementById('shareImg').src = dataUrl;
      document.getElementById('shareNote').textContent = canShareFile
        ? 'So wird der Ausschnitt verschickt.'
        : 'Halte das Bild gedrückt und wähle «In Fotos sichern» oder «Teilen».';
      const btns = document.getElementById('shareButtons');
      btns.innerHTML = '';
      btns.appendChild(button('Schliessen', '', closeShare));
      if (canShareFile) {
        btns.appendChild(button('📤 Teilen', 'primary', () => {
          navigator.share({ files: [file], text }).catch(() => {});
        }));
      }
      document.getElementById('shareView').classList.add('open');
    }

    // ---------- Dialog ----------
    function dialog(title, text, buttons) {
      document.getElementById('dialogTitle').textContent = title;
      document.getElementById('dialogText').textContent = text;
      const box = document.getElementById('dialogButtons');
      box.innerHTML = '';
      const el = document.getElementById('dialog');
      buttons.forEach((b) => {
        box.appendChild(button(b.label, b.danger ? 'danger' : b.primary ? 'primary' : '', () => {
          el.classList.remove('open');
          if (b.onClick) b.onClick();
        }));
      });
      el.classList.add('open');
    }

    // ---------- Start ----------
    setBase('karte');
    renderDrawing();
    renderUI();
    window.addEventListener('resize', renderUI);
    startWatching();
  })();
  </script>
</body>
</html>
