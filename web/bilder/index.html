<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Einsatzbilder</title>
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bilder">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#efedea,#111315);--card:light-dark(#fff,#1b1e21);--ink:light-dark(#16181a,#eef0f2);--mute:light-dark(#5b6166,#9aa1a7);--line:light-dark(#d8d4ce,#30353a);--field:light-dark(#f7f6f4,#24282c);--red:#c8102e;--warn:#f2b705;--ok:light-dark(#1d7a46,#45c47a);--or:#d96c00}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;overflow-x:clip}
.top{position:sticky;top:0;z-index:50;background:var(--red);color:#fff;display:flex;align-items:center;gap:10px 16px;padding:calc(10px + env(safe-area-inset-top)) max(3vw,14px) 10px}
.top a.logo{flex:none;width:52px;height:54px;display:grid;place-items:center}
.top a.logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.top h1{font:600 22px/1.1 "Barlow Condensed",sans-serif;margin:0;flex:1}
.top h1 small{display:block;font:500 14px Barlow,sans-serif;opacity:.9;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{font:700 clamp(30px,5.5vw,46px)/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.sync{font-size:13.5px;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.18);white-space:nowrap}
.sync::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#bbb;vertical-align:1px}
.sync.ok::before{background:#5ee08f}.sync.warn::before{background:var(--warn)}.sync.err::before{background:#fff;outline:2px solid #000}
button{font:600 16px Barlow,sans-serif;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
button.pri{background:var(--red);border-color:var(--red);color:#fff}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.ghost{background:none;border-color:transparent;color:var(--mute);min-height:36px;padding:4px 8px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
svg{width:22px;height:22px;flex:none}
main{max-width:1150px;margin:0 auto;padding:16px max(3vw,14px) calc(30px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font:700 24px/1.1 "Barlow Condensed",sans-serif;margin:0 0 12px}
label{display:block;font-size:14px;font-weight:600;color:var(--mute);margin-bottom:12px}
input{display:block;width:100%;margin-top:4px;font:16px Barlow,sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px}
.mute{color:var(--mute)}
.err{color:var(--red);font-weight:600;margin:0 0 10px}.err:empty{display:none}
/* Dashboard */
.dlay{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:700px){.dlay{grid-template-columns:1fr}}
.dt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-top:6px solid var(--red);border-radius:12px;padding:18px;min-height:120px;font-weight:400;box-shadow:0 1px 3px rgba(0,0,0,.08);position:sticky;top:110px;width:100%}
@media(max-width:700px){.dt{position:static;min-height:0}}
.dt b{font:700 25px/1.05 "Barlow Condensed",sans-serif}.dt span{color:var(--mute);font-size:15px}
.rc{background:var(--red);color:#fff;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer}
.rc.fwe{border:10px solid transparent;background:linear-gradient(var(--red),var(--red)) padding-box,repeating-linear-gradient(-45deg,#f2b705 0 16px,#16181a 16px 32px) border-box;border-radius:14px}
.rc small{display:block;font-size:14px;opacity:.92}.rc b{display:block;font:700 30px/1.1 "Barlow Condensed",sans-serif;margin:2px 0}
.rc .info{font-size:16px;opacity:.95}
.rc .bb{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rc .bb button{border:0;background:#fff;color:var(--red);font-weight:700}
.rc .bb button.sec{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.75)}
.rcempty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px;margin-bottom:14px;color:var(--mute);text-align:center}
.elist{list-style:none;margin:0;padding:0}
.elist li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.elist li:last-child{border-bottom:0}.elist div{flex:1}.elist b{display:block}.elist span{font-size:14px;color:var(--mute)}
/* Ordner */
.ohead{border-top:6px solid var(--red)}
.ohead.fwe{border:10px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,repeating-linear-gradient(-45deg,#f2b705 0 16px,#16181a 16px 32px) border-box;border-radius:14px}
.ohead h2{font-size:30px;margin-bottom:4px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.acts button{min-height:64px;font-size:18px;flex-direction:column;gap:2px}
.acts button small{font-weight:500;font-size:13px;opacity:.85}
.acts svg{width:28px;height:28px}
.qrstate{margin-top:10px;font-size:15px}
.qrstate b{color:var(--ok)}
.prog{margin-top:10px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ph{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in;background:#222}
.ph .nm{padding:6px 8px 2px;font-weight:600;font-size:14px;line-height:1.25;cursor:pointer;word-break:break-word}
.ph .nm:hover{text-decoration:underline}
.ph .mt{padding:0 8px 7px;font-size:12px;color:var(--mute)}
.ph .mt .qr{font-size:10px;font-weight:700;background:var(--ok);color:#fff;border-radius:3px;padding:0 4px;margin-right:4px}
.empty{color:var(--mute);text-align:center;padding:24px 0}
/* Lightbox */
#lb{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);color:#fff;display:flex;flex-direction:column}
#lb .lbtop{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;flex-wrap:wrap}
#lb .lbtop b{flex:1;font:700 20px "Barlow Condensed",sans-serif}
#lb .lbtop small{display:block;font:500 13px Barlow,sans-serif;opacity:.8}
#lb button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
#lb .lbimg{flex:1;display:grid;place-items:center;position:relative;min-height:0}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:72px;font-size:30px}
#lb .nav.p{left:8px}#lb .nav.n{right:8px}
#lb .ld{position:absolute;inset:0;display:grid;place-items:center;font-weight:600}
dialog{border:0;border-radius:14px;padding:18px;width:min(460px,94vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin-bottom:8px}
.dbtn{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fwtake{width:100%;text-align:left;justify-content:flex-start;margin-bottom:12px;border:3px solid transparent;color:#16181a;background:linear-gradient(#fff8e1,#fff8e1) padding-box,repeating-linear-gradient(-45deg,#f2b705 0 10px,#16181a 10px 20px) border-box}
#qrBody{text-align:center}#qrBody svg{width:min(300px,70vw);height:auto;background:#fff;padding:6px;border-radius:8px}
#login{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;padding:16px}
#msg{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16181a;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:400;max-width:90vw}
#msg:empty{display:none}
@media(max-width:480px){.top h1{font-size:20px}.gal{grid-template-columns:repeat(2,1fr);gap:8px}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" id="aHome" href="../start/" title="Zum Dashboard / zur Startseite"><img src="logo.png" alt="FW RTL"></a>
  <h1>Einsatzbilder<small id="hSub">Fotos zum Einsatz</small></h1>
  <span class="sync" id="sync">Startet …</span>
  <div id="clock">--:--</div>
</header>

<main>
  <!-- Dashboard -->
  <section id="vDash" hidden>
    <div class="dlay">
      <button class="dt" id="bNew"><b>+ Neuer Einsatz</b><span>Bilder-Ordner eröffnen</span></button>
      <div>
        <div id="dRun"></div>
        <div class="card">
          <h2>Abgeschlossene Einsätze</h2>
          <ul class="elist" id="dDone"></ul>
        </div>
      </div>
    </div>
  </section>

  <!-- Ordner eines Einsatzes -->
  <section id="vE" hidden>
    <div class="card ohead" id="oHead">
      <small class="mute" id="oState"></small>
      <h2 id="oTitle"></h2>
      <div class="mute" id="oInfo"></div>
      <div class="acts" id="oActs">
        <button class="pri" id="bCam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Foto aufnehmen</button>
        <button id="bPick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>Aus Galerie<small>mehrere möglich</small></button>
        <button id="bQR"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM18 18h3v3h-3zM14 20h2M20 14v2"/></svg>QR-Code für AdF<small id="qrSmall">AdF laden per Handy hoch</small></button>
      </div>
      <div class="qrstate" id="qrState" hidden></div>
      <div class="prog" id="prog" hidden></div>
      <input type="file" id="fCam" accept="image/*" capture="environment" hidden>
      <input type="file" id="fPick" accept="image/*" multiple hidden>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px"><h2 style="margin:0;flex:1">Bilder <span id="cnt" class="mute" style="font-size:18px"></span></h2>
        <button id="bAll" class="ghost">Alle herunterladen</button><button id="bCloseE" class="ghost">Einsatz abschliessen</button></div>
      <div class="gal" id="gal"></div>
    </div>
  </section>
</main>

<!-- Grossansicht -->
<div id="lb" hidden>
  <div class="lbtop"><b id="lbName"></b>
    <button id="lbRen">Umbenennen</button><button id="lbDl">Herunterladen</button><button id="lbShare">Teilen</button><button id="lbDel">Löschen</button><button id="lbX">✕</button></div>
  <div class="lbimg"><img id="lbImg" alt=""><div class="ld" id="lbLd">Lädt …</div>
    <button class="nav p" id="lbP" aria-label="Vorheriges Bild">‹</button><button class="nav n" id="lbN" aria-label="Nächstes Bild">›</button></div>
</div>

<!-- QR -->
<dialog id="dQR">
  <h2>Fotos per Handy hochladen</h2>
  <div id="qrBody"></div>
  <div class="dbtn" style="margin-top:12px"><button id="qrStop">QR-Hochladen beenden</button><button id="qrPrint">Drucken</button><button id="qrCopy">Link kopieren</button><button class="pri" id="qrX">Schliessen</button></div>
</dialog>

<!-- Anmeldung -->
<div id="login" hidden><form id="fLogin" class="card" style="width:min(380px,100%)">
  <img src="logo.png" alt="" style="width:70px;display:block;margin:0 auto 6px"><h2 style="text-align:center">Anmelden</h2>
  <p class="mute" style="margin:0 0 12px;font-size:14px">Gleiches Konto wie ASÜ und Journal.</p>
  <label>E-Mail<input name="email" type="email" autocomplete="username" required></label>
  <label>Passwort<input name="pw" type="password" autocomplete="current-password" required></label>
  <p class="err" id="lErr"></p>
  <button class="pri" style="width:100%">Anmelden</button>
</form></div>
<div id="msg"></div>

<script src="config.js?v=1.0.0"></script>
<script src="../shared/fwform.js?v=1"></script>
<script src="foto.js?v=1.0.0"></script>
<script src="../vendor/qrcode-generator/qrcode.js"></script>
<script src="../shared/fwsync.js?v=1"></script>
<script type="module" src="app.js?v=1.0.0"></script>
</body>
</html>
